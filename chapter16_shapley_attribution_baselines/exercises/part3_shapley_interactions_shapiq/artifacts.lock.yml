claim_scope: 'GT-0 Shapley interaction preflight: deterministic additive, target-pair,
  and shapiq parity contracts are kept for learner exercises, then a CUDA MLP is trained
  on the complete binary feature table for the same nonlinear coalition game used
  by 16.1 and 16.2. The report recovers the planted positive and negative pair interactions
  from real model ablations, bounds off-target interactions, checks shapiq SII parity
  on the trained model table, and rejects a shuffled-label interaction control. This
  proves local pairwise interaction recovery on a finite trained model organism; it
  is not a claim about large-model token, SAE, vision, or multimodal interaction attribution.'
