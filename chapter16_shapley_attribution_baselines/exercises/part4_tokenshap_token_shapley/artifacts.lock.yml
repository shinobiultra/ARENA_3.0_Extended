evidence_level: exact_structured_token_game_plus_cuda_compatibility_preflight
claim_scope: >-
  The learner result is an exact five-position token game with a necessary token,
  a redundant pair, a distractor, and a planted interaction. It compares exact and
  sampled Shapley with leave-one-out and position controls, then demonstrates
  tokenization and correlated-support failure modes. The separate release-only CUDA
  preflight retains the older four-position finite scorer contract. It validates
  implementation plumbing only and is not a claim about LLM attribution faithfulness.
