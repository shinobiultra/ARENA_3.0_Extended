claim_scope: 'GT-0 TokenSHAP preflight: deterministic masked-token coalition, exact
  TokenShapley, and sampled TokenSHAP contracts are kept for learner exercises, then
  a CUDA embedding MLP is trained on the complete masked coalition table for the four-position
  prompt ''The capital is Paris''. The report computes exact and sampled TokenSHAP
  from real model outputs, checks them against the analytic token game, verifies efficiency
  and top-token ranking, and rejects a shuffled-label token-scorer control. This proves
  local token-position SHAP mechanics on a finite trained model organism; it is not
  a claim about sampled TokenSHAP on a large language model.'
