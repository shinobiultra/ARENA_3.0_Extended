claim_scope: 'GT-0 SHAP-vs-patching preflight: deterministic additive-agreement and
  interaction-overcount contracts are kept for learner exercises, then two CUDA model
  organisms are trained on complete binary feature tables. A linear additive model
  verifies that exact Shapley and full-minus-ablated patching effects agree when the
  learned function is additive. A nonlinear neural coalition game verifies that interaction-heavy
  learned behavior makes patching effects disagree with Shapley and overcount absolute
  credit. This proves the method comparison on real model outputs from finite trained
  systems; it is not a claim about large transformer activation patching.'
