  REQUIRES_GPU: true
gt_tier: GT-0
evidence_level: exact_activation_organism_plus_cuda_model_organism_preflight
claim_scope: >-
  GT-0 SHAP-vs-patching learner result: an exact four-token ReLU organism exposes
  both token-location activations and five post-ReLU hidden units. Exact token SHAP
  allocates the 4.25 clean-minus-corrupt effect efficiently, while full-context
  token noising patching overcounts by the planted 2.4 interaction contribution.
  When both methods use the same post-ReLU hidden units, they agree to float64
  precision. Wrong-location, shuffled-label, matched-random, and zero-interaction
  controls are measured. Supporting CUDA preflight trains additive and nonlinear
  finite model organisms; no general large-transformer equivalence claim is made.
