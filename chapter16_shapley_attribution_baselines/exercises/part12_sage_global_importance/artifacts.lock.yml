claim_scope: Visible conditional Gaussian and exact/sampled marginal SAGE distinguish predictive usefulness
  from output sensitivity. Seven fresh regressors, all 256 coalitions, recipe-disjoint ranking/audit evaluation,
  independent game and model oracles, three network seeds and background/target/random-order controls
  retain negative and unstable attributions. The real study uses a finite empirical marginal background;
  it is not a causal effect, universal optimal-model importance, or whole-paper replication.
