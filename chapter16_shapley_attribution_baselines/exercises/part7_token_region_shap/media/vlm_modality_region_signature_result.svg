<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">VLM modality and region SHAP signature result</title>
  <desc id="desc">A table of toy and pinned CLIP modality and region SHAP metrics showing object localization and controls.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcff; }
      .header { fill: #1e344f; }
      .row1 { fill: #ffffff; }
      .row2 { fill: #edf6ff; }
      .ok { fill: #e9f8ef; stroke: #20814d; stroke-width: 2; rx: 6; }
      .warn { fill: #fff0e8; stroke: #b44b24; stroke-width: 2; rx: 6; }
      .title { font-family: Inter, Arial, sans-serif; fill: #172033; font-size: 23px; font-weight: 750; }
      .head { font-family: Inter, Arial, sans-serif; fill: #ffffff; font-size: 16px; font-weight: 700; }
      .text { font-family: Inter, Arial, sans-serif; fill: #172033; font-size: 17px; }
      .small { font-family: Inter, Arial, sans-serif; fill: #3b4758; font-size: 14px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #172033; font-size: 16px; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="340" rx="12"/>
  <text class="title" x="32" y="42">Signature result: object evidence beats background and OCR controls</text>
  <text class="small" x="32" y="68">Toy exact games first; pinned CLIP rendered-image preflight second.</text>
  <rect class="header" x="32" y="94" width="896" height="40" rx="6"/>
  <text class="head" x="54" y="120">check</text>
  <text class="head" x="320" y="120">value</text>
  <text class="head" x="540" y="120">interpretation</text>
  <rect class="row1" x="32" y="134" width="896" height="42"/>
  <text class="text" x="54" y="161">toy modality values</text>
  <text class="mono" x="320" y="161">[2.0, 1.5]</text>
  <text class="text" x="540" y="161">image/text synergy is split fairly</text>
  <rect class="row2" x="32" y="176" width="896" height="42"/>
  <text class="text" x="54" y="203">toy region values</text>
  <text class="mono" x="320" y="203">[2.25, 0.0, 1.0]</text>
  <text class="text" x="540" y="203">background stays a zero control</text>
  <rect class="row1" x="32" y="218" width="896" height="42"/>
  <text class="text" x="54" y="245">pinned CLIP modality</text>
  <text class="mono" x="320" y="245">synergy 5.864</text>
  <text class="text" x="540" y="245">real logits need both image and text</text>
  <rect class="row2" x="32" y="260" width="896" height="42"/>
  <text class="text" x="54" y="287">pinned CLIP regions</text>
  <text class="mono" x="320" y="287">margin 1.381</text>
  <text class="text" x="540" y="287">object attribution beats non-object controls</text>
  <rect class="ok" x="32" y="312" width="250" height="1"/>
  <rect class="ok" x="650" y="22" width="278" height="48"/>
  <text class="text" x="670" y="53">target margin = 3.384</text>
  <rect class="warn" x="650" y="72" width="278" height="48"/>
  <text class="text" x="670" y="103">claim scope: rendered CLIP</text>
</svg>
