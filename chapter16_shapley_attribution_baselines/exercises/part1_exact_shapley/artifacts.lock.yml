evidence_level: exact_shapley_contract_plus_cuda_trained_neural_game_preflight
claim_scope: 'GT-0 exact Shapley preflight: deterministic additive, conjunction, permutation-parity,
  and leave-one-out interaction contracts are kept for learner exercises, then a CUDA
  MLP is trained on the complete binary feature table for a known nonlinear coalition
  game. The report computes exact Shapley values from real model ablations, checks
  them against the analytic data-generating game, verifies efficiency, and rejects
  a shuffled-label model that fits its shuffled table but fails the true attribution
  vector. This proves exact Shapley on a finite trained model organism; it is not
  a claim about approximate SHAP on large models.'
