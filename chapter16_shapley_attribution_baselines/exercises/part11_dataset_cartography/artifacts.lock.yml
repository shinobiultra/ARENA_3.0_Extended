claim_scope: Student-implemented confidence, population variability and correctness map actual MLP learning
  histories. Stable IDs, both logging conventions, five seeds, linear and random-label controls, known injected
  errors, class-matched selections and equal-update comparisons test what the maps mean. All 140 primary training
  runs and 2620 held-out images are retained. Low confidence retrieves many injected errors, while one-third
  high-variability selection underperforms its matched control. This is a small-network digit experiment, not
  a RoBERTa NLP, natural OOD or whole-paper reproduction.
