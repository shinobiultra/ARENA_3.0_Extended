claim_scope: 'GT-0 Data Shapley preflight: deterministic exact, Monte Carlo, and first-order
  in-run Data Shapley contracts are kept for learner exercises, then a one-step linear
  regression problem is evaluated on CUDA. The report enumerates all training-example
  coalitions on GPU, runs an actual full-batch one-step optimizer update, computes
  per-example autograd gradient-dot scores in the same run, compares exact and sampled
  Data Shapley values, verifies that the harmful flipped example is identified and
  deletion improves utility, rejects deterministic random-data and label-shuffled
  attribution controls, and reports measured runtime overhead for full-update, exact-enumeration,
  and in-run score paths. This proves the one-training-run attribution mechanics on
  a finite model organism; it is not a claim about large-dataset TracIn, influence
  functions, or production data valuation.'
