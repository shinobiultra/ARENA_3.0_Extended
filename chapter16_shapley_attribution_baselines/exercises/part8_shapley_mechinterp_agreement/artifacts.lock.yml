claim_scope: 'GT-0 SHAP/mechanistic-agreement preflight: deterministic additive agreement
  and XOR interaction-disagreement contracts are kept for learner exercises, then
  a nonlinear CUDA neural coalition game is trained on the complete binary feature
  table. The report compares exact Shapley values from real model ablations against
  known analytic mechanistic feature contributions, checks rank correlation, top-k
  overlap, deletion consequence, planted pair-interaction recovery, and rejects a
  shuffled-label model that fails mechanistic agreement. This proves the agreement-testing
  workflow on a finite trained model organism; it is not a claim about broad mechanistic
  interpretability agreement in large models.'
