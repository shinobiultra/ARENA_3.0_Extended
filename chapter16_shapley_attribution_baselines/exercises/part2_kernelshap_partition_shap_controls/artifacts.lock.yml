claim_scope: 'GT-0 SHAP baseline preflight: deterministic KernelSHAP and PartitionSHAP/Owen-value
  contracts are kept for learner exercises, then a CUDA MLP is trained on the complete
  binary feature table for the same nonlinear coalition game used by 16.1. The report
  computes KernelSHAP from real model ablations, checks parity against exact Shapley
  and analytic ground truth, verifies singleton and grouped PartitionSHAP parity,
  checks a cross-group interaction counterexample where the irrelevant grouped player
  receives zero credit, and rejects a shuffled-label attribution control. This proves
  the local full-table SHAP controls on a finite trained model organism; it is not
  a claim about sampled SHAP on large language or vision models.'
