claim_scope: >-
  Student-implemented path-dependent and finite-background interventional TreeSHAP match exhaustive
  8-feature games across three clean tree families, while all 18 fresh fits, 486 component trees,
  272 held-out rows per model, Saabas, deletion orders, shuffled targets, background variants and
  mechanism controls are retained. Unmodified SHAP 0.49.1 interventional routing fails on disclosed
  float32-threshold cases; a separately threshold-corrected compiled reference passes the original
  tolerance. The public concrete study is predictive attribution, not a causal material recipe or
  whole-paper benchmark replication.
