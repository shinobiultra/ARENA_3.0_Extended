<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Data Shapley signature result</title>
  <desc id="desc">Bar chart showing exact Data Shapley, sampled estimates, and in-run gradient scores for four training examples, with the flipped-label example negative.</desc>
  <rect width="960" height="390" fill="#fbfaf7"/>
  <style>
    .axis{stroke:#243b53;stroke-width:2}
    .zero{stroke:#102a43;stroke-width:2}
    .grid{stroke:#d9e2ec;stroke-width:1}
    .head{font:700 22px sans-serif;fill:#102a43}
    .label{font:15px sans-serif;fill:#334e68}
    .small{font:13px sans-serif;fill:#52606d}
    .exact{fill:#2f80ed}
    .sample{fill:#27ae60}
    .proxy{fill:#f2994a}
    .bad{fill:#d64545}
    .note{fill:#ffffff;stroke:#243b53;stroke-width:1.5;rx:8}
  </style>
  <text x="40" y="42" class="head">Signature result: the flipped-label example is harmful across exact, sampled, and in-run scores</text>
  <text x="40" y="70" class="small">Exact values and sampled estimates are utility units; gradient-dot scores are signed proxy units.</text>
  <line x1="80" y1="304" x2="680" y2="304" class="axis"/>
  <line x1="80" y1="104" x2="80" y2="334" class="axis"/>
  <line x1="80" y1="204" x2="680" y2="204" class="zero"/>
  <line x1="80" y1="154" x2="680" y2="154" class="grid"/>
  <line x1="80" y1="254" x2="680" y2="254" class="grid"/>
  <text x="42" y="208" class="small">0</text>
  <text x="112" y="342" class="label">ex0</text>
  <text x="252" y="342" class="label">ex1</text>
  <text x="392" y="342" class="label">ex2</text>
  <text x="532" y="342" class="label">ex3 flipped</text>
  <rect x="104" y="140" width="24" height="64" class="exact"/>
  <rect x="132" y="138" width="24" height="66" class="sample"/>
  <rect x="160" y="104" width="24" height="100" class="proxy"/>
  <rect x="244" y="140" width="24" height="64" class="exact"/>
  <rect x="272" y="140" width="24" height="64" class="sample"/>
  <rect x="300" y="104" width="24" height="100" class="proxy"/>
  <rect x="384" y="140" width="24" height="64" class="exact"/>
  <rect x="412" y="135" width="24" height="69" class="sample"/>
  <rect x="440" y="104" width="24" height="100" class="proxy"/>
  <rect x="524" y="204" width="24" height="117" class="bad"/>
  <rect x="552" y="204" width="24" height="124" class="bad"/>
  <rect x="580" y="204" width="24" height="100" class="bad"/>
  <rect x="704" y="104" width="220" height="154" class="note"/>
  <rect x="724" y="128" width="18" height="18" class="exact"/>
  <text x="752" y="142" class="label">Exact Data Shapley</text>
  <rect x="724" y="158" width="18" height="18" class="sample"/>
  <text x="752" y="172" class="label">Sampled permutation</text>
  <rect x="724" y="188" width="18" height="18" class="proxy"/>
  <text x="752" y="202" class="label">In-run gradient dot</text>
  <rect x="724" y="218" width="18" height="18" class="bad"/>
  <text x="752" y="232" class="label">Harmful example</text>
  <text x="704" y="292" class="label">Controls: random-data and label-shuffle attribution both fail.</text>
  <text x="704" y="320" class="label">CUDA: 16 coalitions, 512 MC samples, peak VRAM 0.063 GB.</text>
</svg>
