<svg xmlns="http://www.w3.org/2000/svg" width="920" height="310" viewBox="0 0 920 310" role="img" aria-labelledby="title desc">
  <title id="title">KernelSHAP and PartitionSHAP signature result</title>
  <desc id="desc">A compact visualization of the 16.2 CUDA KernelSHAP and PartitionSHAP signature result.</desc>
  <defs>
    <style>
      .bg { fill: #eef6ff; }
      .card { fill: #ffffff; stroke: #1e3a8a; stroke-width: 2; rx: 12; }
      .title { fill: #0f172a; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 800; }
      .label { fill: #334155; font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .value { fill: #0f766e; font-family: Inter, Arial, sans-serif; font-size: 26px; font-weight: 800; }
      .muted { fill: #475569; font-family: Inter, Arial, sans-serif; font-size: 13px; }
      .barbg { fill: #bfdbfe; }
      .bar { fill: #0f766e; }
      .bad { fill: #9a3412; }
    </style>
  </defs>
  <rect class="bg" width="920" height="310"/>
  <text class="title" x="40" y="48">16.2 signature result: full-table SHAP controls pass, shortcut failures stay visible</text>
  <rect class="card" x="40" y="82" width="180" height="154"/>
  <text class="label" x="62" y="114">KernelSHAP error</text>
  <text class="value" x="62" y="154">9.38e-7</text>
  <rect class="barbg" x="62" y="180" width="132" height="14"/>
  <rect class="bar" x="62" y="180" width="18" height="14"/>
  <text class="muted" x="62" y="214">vs analytic truth, threshold 1e-4</text>
  <rect class="card" x="260" y="82" width="190" height="154"/>
  <text class="label" x="282" y="114">Owen-value controls</text>
  <text class="value" x="282" y="154">pass</text>
  <text class="muted" x="282" y="184">singleton, aligned group,</text>
  <text class="muted" x="282" y="205">and mismatched group parity</text>
  <rect class="card" x="490" y="82" width="198" height="154"/>
  <text class="label" x="512" y="114">irrelevant grouped player</text>
  <text class="value" x="512" y="154">0.0</text>
  <text class="muted" x="512" y="184">cross-group interaction</text>
  <text class="muted" x="512" y="205">would expose shortcut attribution</text>
  <rect class="card" x="728" y="82" width="154" height="154"/>
  <text class="label" x="750" y="114">negative control</text>
  <text class="value" x="750" y="154">rejected</text>
  <text class="muted" x="750" y="184">shuffled-label error</text>
  <text class="muted" x="750" y="205">4.6333</text>
  <text class="muted" x="40" y="274">Claim scope: complete finite binary-feature table from a CUDA-trained neural coalition game, not sampled SHAP reliability on large models.</text>
</svg>
