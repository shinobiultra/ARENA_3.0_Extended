<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Shapley interaction validation loop</title>
  <desc id="desc">A validation loop for exact pairwise Shapley interactions and shapiq parity on finite coalition games.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 14; }
      .text { fill: #0f172a; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .small { fill: #334155; font-family: Inter, Arial, sans-serif; font-size: 14px; }
      .pair { fill: #7c3aed; }
      .control { fill: #9a3412; }
      .tool { fill: #0f766e; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="360"/>
  <rect class="panel" x="38" y="74" width="180" height="172"/>
  <circle class="pair" cx="72" cy="110" r="12"/>
  <text class="text" x="94" y="117">Toy games</text>
  <text class="small" x="62" y="152">Additive tables</text>
  <text class="small" x="62" y="173">must have zero</text>
  <text class="small" x="62" y="194">pair interactions</text>
  <path class="arrow" d="M228 160 H290"/>
  <rect class="panel" x="302" y="74" width="190" height="172"/>
  <circle class="pair" cx="336" cy="110" r="12"/>
  <text class="text" x="358" y="117">Pair delta</text>
  <text class="small" x="326" y="152">Average second-order</text>
  <text class="small" x="326" y="173">coalition effects</text>
  <text class="small" x="326" y="194">with SII weights</text>
  <path class="arrow" d="M502 160 H564"/>
  <rect class="panel" x="576" y="74" width="220" height="172"/>
  <circle class="tool" cx="610" cy="110" r="12"/>
  <text class="text" x="632" y="117">Tool parity</text>
  <text class="small" x="600" y="152">Compare exact matrix</text>
  <text class="small" x="600" y="173">to shapiq SII on</text>
  <text class="small" x="600" y="194">the same table</text>
  <path class="arrow" d="M688 258 C610 322 310 322 172 258"/>
  <rect class="panel" x="342" y="250" width="240" height="78"/>
  <circle class="control" cx="376" cy="285" r="12"/>
  <text class="text" x="398" y="292">Controls reject</text>
  <text class="small" x="364" y="315">off-target and shuffled-label interactions</text>
</svg>
