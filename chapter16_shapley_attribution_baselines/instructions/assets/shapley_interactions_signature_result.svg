<svg xmlns="http://www.w3.org/2000/svg" width="920" height="310" viewBox="0 0 920 310" role="img" aria-labelledby="title desc">
  <title id="title">Shapley interactions signature result</title>
  <desc id="desc">A compact visualization of the 16.3 CUDA pairwise Shapley interaction signature result.</desc>
  <defs>
    <style>
      .bg { fill: #f5f3ff; }
      .card { fill: #ffffff; stroke: #5b21b6; stroke-width: 2; rx: 12; }
      .title { fill: #0f172a; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 800; }
      .label { fill: #334155; font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .value { fill: #0f766e; font-family: Inter, Arial, sans-serif; font-size: 25px; font-weight: 800; }
      .muted { fill: #475569; font-family: Inter, Arial, sans-serif; font-size: 13px; }
      .neg { fill: #9a3412; font-family: Inter, Arial, sans-serif; font-size: 25px; font-weight: 800; }
      .barbg { fill: #ddd6fe; }
      .bar { fill: #0f766e; }
    </style>
  </defs>
  <rect class="bg" width="920" height="310"/>
  <text class="title" x="40" y="48">16.3 signature result: planted pair interactions recover from real ablations</text>
  <rect class="card" x="40" y="82" width="188" height="154"/>
  <text class="label" x="62" y="114">positive pair (0, 2)</text>
  <text class="value" x="62" y="154">2.2000004</text>
  <text class="muted" x="62" y="184">expected 2.2</text>
  <text class="muted" x="62" y="205">abs error 4.52e-7</text>
  <rect class="card" x="266" y="82" width="188" height="154"/>
  <text class="label" x="288" y="114">negative pair (1, 3)</text>
  <text class="neg" x="288" y="154">-1.5000007</text>
  <text class="muted" x="288" y="184">expected -1.5</text>
  <text class="muted" x="288" y="205">abs error 4.50e-7</text>
  <rect class="card" x="492" y="82" width="188" height="154"/>
  <text class="label" x="514" y="114">off-target max</text>
  <text class="value" x="514" y="154">6.61e-7</text>
  <rect class="barbg" x="514" y="180" width="132" height="14"/>
  <rect class="bar" x="514" y="180" width="18" height="14"/>
  <text class="muted" x="514" y="214">threshold 1e-4</text>
  <rect class="card" x="718" y="82" width="164" height="154"/>
  <text class="label" x="740" y="114">shapiq / shuffle</text>
  <text class="value" x="740" y="154">pass / reject</text>
  <text class="muted" x="740" y="184">shapiq error 1.18e-8</text>
  <text class="muted" x="740" y="205">shuffle error 4.3833</text>
  <text class="muted" x="40" y="274">Claim scope: pairwise interactions on a complete finite CUDA-trained coalition game, not broad large-model interaction attribution.</text>
</svg>
