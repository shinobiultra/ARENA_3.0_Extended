          read the transition off the adapter's singular vectors, and intervene.
      - number: "15.5"
        title: VLM LoRA
        dir: part5_vlm_lora
        sources: []
        requirements: [peft.vlm_lora]
        brief: >
          New section. LoRA on the mini VLM from 12.3 (and optionally a small real VLM): which modules matter (projector vs
