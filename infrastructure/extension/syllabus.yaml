        requirements: [shapley.kernelshap, shapley.partitionshap_owen]
      - number: "16.3"
        title: TreeSHAP, DeepSHAP and GradientSHAP
        dir: part3_model_specific_shap
        sources: [chapter16_shapley_attribution_baselines/exercises/part13_treeshap, chapter16_shapley_attribution_baselines/exercises/part14_deepshap, chapter16_shapley_attribution_baselines/exercises/part15_gradientshap]
        requirements: [shapley.treeshap, shapley.deepshap, shapley.gradientshap]
      - number: "16.4"
