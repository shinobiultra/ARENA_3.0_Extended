chapters:
  chapter0_fundamentals:
    sections:
    - id: 06_fake_interpretability_results
      number: '0.6'
      title: How to Know When an Interpretability Result Is Fake
      exercise_dir: part6_fake_interpretability_results
      page_file: 06_[0.6]_How_to_Know_When_an_Interpretability_Result_Is_Fake.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-00.png
      status: Fake-result diagnostic GT-0 controls added
      streamlit_description: Build deterministic diagnostics for leakage, cherry-picked examples, probe overfitting, and random-direction steering failures.
      streamlit_description_short: Learn diagnostics for bogus interpretability results.
  chapter1_transformer_interp:
    sections:
    - id: 40_frontier_infra
      number: '1.6'
      title: Local Frontier ML Infrastructure
      exercise_dir: part6_frontier_ml_infrastructure
      page_file: 40_[1.6]_Local_Frontier_ML_Infrastructure.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-14-1.png
      status: Infrastructure harness added
      streamlit_description: 'Build the local-first verification harness for frontier-extension notebooks: environment checks, VRAM estimates, HF parity metrics, generation parity, activation storage, and smoke-test contracts.'
      streamlit_description_short: Reusable verification harness for local frontier-model notebooks.
  chapter5_modern_architectures:
    title: 'Chapter 5: Modern Architectures'
    short_title: Modern Architectures
    short_description: Local-first labs for modern model families, starting with a verified Gemma-style decoder implementation.
    description: 'This extension chapter keeps the original ARENA style while adding frontier architecture literacy: implement the model family, test it against reference behavior, and only then use it for interpretability.'
    color: '#2563EB'
    icon: cpu
    header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-11.png
    sections:
    - id: 1_gemma_from_scratch
      number: '5.1'
      title: Gemma from Scratch
      exercise_dir: part1_gemma_from_scratch
      page_file: 01_[5.1]_Gemma_from_Scratch.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-11.png
      status: Tiny implementation and cache-parity tests added
      streamlit_description: Implement a Gemma-style decoder with RMSNorm, RoPE, grouped-query attention, sliding-window causal masks, SwiGLU, tied embeddings, and KV-cache parity checks.
      streamlit_description_short: Build and verify a tiny Gemma-style decoder.
    - id: 2_gemma_scope_feature_steering
      number: '5.2'
      title: Gemma Scope and Feature Steering
      exercise_dir: part2_gemma_scope_feature_steering
      page_file: 02_[5.2]_Gemma_Scope_and_Feature_Steering.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
      status: Synthetic metrics and validation harness added
      streamlit_description: 'Use released Gemma Scope-style sparse feature artifacts with rigorous validation: SAE metrics, direct logit attribution, held-out feature AUC, steering controls, and ablation controls.'
      streamlit_description_short: Validate sparse features with metrics, held-out examples, steering, and ablation.
    - id: 3_mamba_from_scratch
      number: '5.3'
      title: Mamba from Scratch
      exercise_dir: part3_mamba_from_scratch
      page_file: 03_[5.3]_Mamba_from_Scratch.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-11.png
      status: Selective-scan and recurrent-state parity harness added
      streamlit_description: Implement Mamba-style selective scans, causal convolution, a tiny Mamba block, and recurrent-state inference, with recurrent/parallel/chunked equivalence checks.
      streamlit_description_short: Build and verify selective-scan SSMs and tiny Mamba recurrent inference.
    - id: 4_mamba_state_tracking
      number: '5.4'
      title: Mamba State Tracking
      exercise_dir: part4_mamba_state_tracking
      page_file: 04_[5.4]_Mamba_State_Tracking.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-15-3.png
      status: Synthetic state-tracking benchmark harness added
      streamlit_description: Build parity and bracket-depth model organisms, fit probes to latent states, test held-out position generalization, and verify causal state interventions against random controls.
      streamlit_description_short: Probe and intervene on synthetic state-tracking representations.
    - id: 5_diffusion_language_models
      number: '5.5'
      title: Toy Discrete Diffusion Language Models and Local DiffusionGemma Proof
      exercise_dir: part5_diffusion_language_models
      page_file: 05_[5.5]_Diffusion_Language_Models.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-05.png
      status: Toy discrete diffusion harness added
      streamlit_description: Implement toy discrete noising, masked denoising loss, confidence remasking, oracle sampling, entropy/commitment metrics, and activation-trajectory checks before loading a released diffusion LM.
      streamlit_description_short: Build and verify toy discrete diffusion LM mechanics.
    - id: 6_multimodal_embedding_function_models
      number: '5.6'
      title: Embedding Retrieval and Function-Calling Controls
      exercise_dir: part6_multimodal_embedding_function_models
      page_file: 06_[5.6]_Multimodal_Embedding_and_Function_Calling_Models.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
      status: Synthetic specialist-model validation harness added
      streamlit_description: Validate specialist model families with masked embedding pooling, paired retrieval metrics, centroid probes, tool masking, no-call hallucination checks, and schema-token attribution controls.
      streamlit_description_short: Build and verify embedding retrieval and function-call validation tools.
  chapter6_sparse_feature_methods:
    title: 'Chapter 6: Sparse Feature Methods'
    short_title: Sparse Feature Methods
    short_description: Local-first sparse feature labs for SAE variants, released feature artifacts, transcoders, attribution graphs, and crosscoders.
    description: This extension chapter upgrades ARENA's toy superposition and SAE material into a frontier sparse-feature methods track with variant comparisons, validation controls, and feature-level causal tests.
    color: '#7C3AED'
    icon: microscope
    header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
    sections:
    - id: 1_sae_variants
      number: '6.1'
      title: SAE Variants
      exercise_dir: part1_sae_variants
      page_file: 01_[6.1]_SAE_Variants.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
      status: ARENA-style SAE mechanics and Pythia TopK preflight section added
      streamlit_description: Compare ReLU/L1, TopK, Gated, and JumpReLU SAE encoders with reconstruction metrics, planted-dictionary recovery checks, feature AUC validation, density checks, and decoder-vector steering controls.
      streamlit_description_short: Build SAE variants, validate controls, and inspect a Pythia TopK SAE preflight.
    - id: 2_gemma_scope_deep_dive
      number: '6.2'
      title: Gemma Scope Deep Dive
      exercise_dir: part2_gemma_scope_deep_dive
      page_file: 02_[6.2]_Gemma_Scope_Deep_Dive.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
      status: ARENA-style Gemma Scope artifact and activation validation section added
      streamlit_description: Validate a pinned Gemma Scope residual SAE artifact with metadata checks, prompt-score reductions, held-out AUC controls, base-vs-instruction deltas, ablation, steering safety, direct logit attribution, and authenticated Gemma 3 activation evidence.
      streamlit_description_short: Validate released Gemma Scope features with held-out controls and real Gemma activations.
    - id: 3_transcoders_attribution_graphs
      number: '6.3'
      title: Transcoders and Attribution Graphs
      exercise_dir: part3_transcoders_attribution_graphs
      page_file: 03_[6.3]_Transcoders_and_Attribution_Graphs.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
      status: ARENA-style transcoder and attribution-graph validation section added
      streamlit_description: Build ReLU transcoder replacements, verify KL and target-logit preservation, construct signed attribution graphs, check reproducibility and graph-damage controls, and inspect a pinned TransformerLens gelu-1l CUDA preflight.
      streamlit_description_short: Validate transcoder replacements and attribution graphs with GELU-1L controls.
    - id: 4_crosscoders_model_diffing
      number: '6.4'
      title: Crosscoders and Model Diffing
      exercise_dir: part4_crosscoders_model_diffing
      page_file: 04_[6.4]_Crosscoders_and_Model_Diffing.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
      status: ARENA-style crosscoder and model-diffing validation section added
      streamlit_description: Build shared/model-specific crosscoder reconstructions, classify feature ownership, validate behavior-delta prediction, test paired score deltas and direction-removal controls, and inspect a pinned GELU-1L vs SoLU-1L CUDA preflight.
      streamlit_description_short: Validate crosscoder model-diffing features with paired GELU/SoLU controls.
  chapter7_activation_to_language:
    title: 'Chapter 7: Activation to Language'
    short_title: Activation to Language
    short_description: Local-first activation-to-language labs for lenses, Patchscopes, feature verbalizers, activation oracles, NLAs, and predictive concept decoders.
    description: This extension chapter turns model activations into auditable language-facing hypotheses, with held-out accuracy, counterfactual, random-activation, and baseline controls.
    color: '#0891B2'
    icon: microscope
    header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-14-1.png
    sections:
    - id: 1_lenses_patchscopes
      number: '7.1'
      title: Logit Lens, Tuned Lens, and Patchscopes
      exercise_dir: part1_lenses_patchscopes
      page_file: 01_[7.1]_Logit_Lens_Tuned_Lens_and_Patchscopes.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-14-1.png
      status: ARENA-style activation-to-language lens and Patchscope validation section added
      streamlit_description: Build logit lens, tuned lens, attention lens, Patchscope templates, final-position activation insertion, counterfactual and random-activation controls, and inspect a pinned TransformerLens gelu-1l CUDA preflight with held-out lens decoding and Patchscope text-only baselines.
      streamlit_description_short: Validate activation-to-language lenses and Patchscopes with GELU-1L controls.
    - id: 2_feature_verbalizers
      number: '7.2'
      title: Feature Verbalizers
      exercise_dir: part2_feature_verbalizers
      page_file: 02_[7.2]_Feature_Verbalizers.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-14-1.png
      status: ARENA-style feature-verbalizer validation section added
      streamlit_description: Build a feature-verbalizer loop with top, bottom, random, and contrastive examples, train-only explanation terms, held-out predictions, counterexamples, revisions, intervention-direction checks, brevity controls, and a pinned GELU-1L residual-direction CUDA preflight.
      streamlit_description_short: Validate feature verbalizers with held-out and intervention controls.
    - id: 3_mini_activation_oracles
      number: '7.3'
      title: Mini Activation Oracles
      exercise_dir: part3_mini_activation_oracles
      page_file: 03_[7.3]_Mini_Activation_Oracles.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-14-1.png
      status: Toy mini Activation Oracle validation harness added
      streamlit_description: Build and verify activation-question datasets, oracle-vs-baseline comparisons, template split accuracy, OOD reports, random-activation graceful failure, and activation-patching answer changes.
      streamlit_description_short: Build and verify mini Activation Oracle evaluation controls.
    - id: 4_mini_natural_language_autoencoders
      number: '7.4'
      title: Mini Natural Language Autoencoders
      exercise_dir: part4_mini_natural_language_autoencoders
      page_file: 04_[7.4]_Mini_Natural_Language_Autoencoders.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-14-1.png
      status: Toy mini Natural Language Autoencoder validation harness added
      streamlit_description: Build and verify toy activation-to-text-to-activation reconstruction, text-only reconstruction baselines, target logit-diff preservation, probe-latent preservation, generated-text brevity, and counterfactual explanation changes.
      streamlit_description_short: Build and verify mini NLA reconstruction and behavior controls.
    - id: 5_predictive_concept_decoders
      number: '7.5'
      title: Predictive Concept Decoders
      exercise_dir: part5_predictive_concept_decoders
      page_file: 05_[7.5]_Predictive_Concept_Decoders.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-14-1.png
      status: Toy Predictive Concept Decoder validation harness added
      streamlit_description: Build and verify sparse concept encoders, question-conditioned decoders, PCD-vs-baseline accuracy comparisons, concept sparsity, seed stability, top-concept removal, random-removal controls, and concept naming audits.
      streamlit_description_short: Build and verify mini PCD sparse-concept controls.
  chapter8_automated_circuits:
    title: 'Chapter 8: Automated Circuits'
    short_title: Automated Circuits
    short_description: Local-first automated-circuit labs for activation patching, attribution patching, EAP, ACDC-style metrics, and circuit tracing.
    description: This extension chapter turns classic activation patching into reusable circuit-discovery infrastructure, then builds toward attribution patching, automated search, and sparse-feature circuit tracing.
    color: '#0F766E'
    icon: workflow
    header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
    sections:
    - id: 1_activation_patching_refresher
      number: '8.1'
      title: Activation Patching Refresher
      exercise_dir: part1_activation_patching_refresher
      page_file: 01_[8.1]_Activation_Patching_Refresher.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
      status: Reusable activation patching validation harness added
      streamlit_description: Build and verify clean/corrupt logit-diff metrics, activation-slice patching, recovered-fraction reports, per-component patching sweeps, target-component localization, and random patch controls.
      streamlit_description_short: Build and verify reusable activation patching controls.
    - id: 2_attribution_patching_eap
      number: '8.2'
      title: Attribution Patching and EAP
      exercise_dir: part2_attribution_patching_eap
      page_file: 02_[8.2]_Attribution_Patching_and_EAP.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
      status: Attribution patching and EAP validation harness added
      streamlit_description: Build and verify first-order attribution patching, integrated-gradient patch scores, EAP-style edge scores, exact-vs-approx score correlation, top-k overlap, runtime speedup, and documented false negatives.
      streamlit_description_short: Build and verify attribution patching and EAP controls.
    - id: 3_acdc_circuit_metrics
      number: '8.3'
      title: ACDC and Circuit Metrics
      exercise_dir: part3_acdc_circuit_metrics
      page_file: 03_[8.3]_ACDC_and_Circuit_Metrics.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
      status: ACDC-style pruning and circuit metric harness added
      streamlit_description: Build and verify ACDC-style edge pruning, circuit faithfulness, minimality, completeness, same-size random circuit baselines, and held-out prompt-template OOD checks.
      streamlit_description_short: Build and verify ACDC-style circuit quality metrics.
    - id: 4_circuit_tracing_attribution_graphs
      number: '8.4'
      title: Circuit Tracing with Attribution Graphs
      exercise_dir: part4_circuit_tracing_attribution_graphs
      page_file: 04_[8.4]_Circuit_Tracing_with_Attribution_Graphs.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
      status: Circuit tracing attribution-graph validation harness added
      streamlit_description: Build and verify local attribution graphs over sparse-feature or transcoder nodes, target-metric explanation, top-path perturbation tests, alternative graph baselines, and summary-predicted counterfactuals.
      streamlit_description_short: Build and verify circuit tracing attribution-graph controls.
    - id: 5_sparse_feature_circuits
      number: '8.5'
      title: Sparse Feature Circuits
      exercise_dir: part5_sparse_feature_circuits
      page_file: 05_[8.5]_Sparse_Feature_Circuits.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-13-2.png
      status: Sparse Feature Circuit toy-oracle ladder added
      streamlit_description: Build and verify a Sparse Feature Circuit ladder with exact node patching, exact edge patching, EAP-vs-EAP-IG comparison, graph thresholding, and same-size random graph controls.
      streamlit_description_short: Build and verify Sparse Feature Circuit toy oracles.
  chapter9_alignment_interpretability:
    title: 'Chapter 9: Alignment Interpretability'
    short_title: Alignment Interpretability
    short_description: Local-first white-box alignment labs for refusal directions, CoT faithfulness, safe proxy drift detection, and monitors.
    description: This extension chapter keeps black-box evals in place while adding white-box interpretability tools for safe steering, hidden reasoning checks, benign drift proxies, and calibrated monitors.
    color: '#BE123C'
    icon: shield-check
    header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-14-1.png
    sections:
    - id: 1_refusal_directions_safe_steering
      number: '9.1'
      title: Refusal Directions and Safe Steering
      exercise_dir: part1_refusal_directions_safe_steering
      page_file: 01_[9.1]_Refusal_Directions_and_Safe_Steering.md
      header_image: https://raw.githubusercontent.com/info-arena/ARENA_img/main/misc/headers/header-14-1.png
      status: Safe refusal-direction steering validation harness added
      streamlit_description: Build and verify mean-difference refusal directions, direction projection scores, refusal-vs-non-refusal separation, safe refusal-rate steering changes, capability degradation bounds, random-direction controls, and candidate-method comparisons.
      streamlit_description_short: Build and verify safe refusal-direction steering controls.
