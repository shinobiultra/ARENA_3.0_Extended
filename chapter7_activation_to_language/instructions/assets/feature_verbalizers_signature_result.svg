<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="title desc">
  <title id="title">Feature verbalizer signature result</title>
  <desc id="desc">A summary of the 7.2 GELU-1L residual-direction verbalizer preflight: score separation, held-out predictions, controls, and intervention deltas.</desc>
  <defs>
    <style>
      .title { font: 700 21px Inter, Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 12px Inter, Arial, sans-serif; fill: #475569; }
      .label { font: 700 12px Inter, Arial, sans-serif; fill: #0f172a; }
      .text { font: 500 11px Inter, Arial, sans-serif; fill: #334155; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .chip { font: 700 12px Inter, Arial, sans-serif; fill: #0f172a; }
      .axis { stroke: #475569; stroke-width: 2; }
      .tick { stroke: #0f172a; stroke-width: 2; }
      .gate { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="380" fill="#f8fafc"/>
  <text x="28" y="34" class="title">Signature result: a verbalizer hypothesis survives held-out and intervention checks</text>
  <text x="28" y="56" class="subtitle">GT-1 pinned TransformerLens GELU-1L residual-direction preflight. Explanation: "Surface verbs: sat, slept, rested."</text>

