<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">Mini Activation Oracle signature result</title>
  <desc id="desc">A summary of the 7.3 GELU-1L mini Activation Oracle preflight: oracle versus baselines, question conditioning, OOD, random activation, and patching controls.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 21px Inter, Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 12px Inter, Arial, sans-serif; fill: #475569; }
      .label { font: 700 12px Inter, Arial, sans-serif; fill: #0f172a; }
      .text { font: 500 11px Inter, Arial, sans-serif; fill: #334155; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .chip { font: 700 12px Inter, Arial, sans-serif; fill: #0f172a; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .gate { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="920" height="390" fill="#f8fafc"/>
  <text x="28" y="35" class="title">Signature result: question conditioning beats prompt/probe baselines</text>
  <text x="28" y="58" class="subtitle">GT-1 pinned TransformerLens GELU-1L preflight over cached final-token residuals.</text>

  <g transform="translate(36,88)">
    <rect width="372" height="224" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="20" y="28" class="label">Oracle vs baselines</text>
    <line x1="58" y1="186" x2="326" y2="186" class="axis"/>
    <line x1="58" y1="58" x2="326" y2="58" class="gate"/>
    <text x="256" y="52" class="mono">0.75 gate</text>
    <rect x="72" y="58" width="36" height="128" rx="4" fill="#0891b2"/>
    <rect x="124" y="122" width="36" height="64" rx="4" fill="#94a3b8"/>
    <rect x="176" y="122" width="36" height="64" rx="4" fill="#94a3b8"/>
    <rect x="228" y="122" width="36" height="64" rx="4" fill="#94a3b8"/>
    <rect x="280" y="122" width="36" height="64" rx="4" fill="#94a3b8"/>
    <text x="76" y="50" class="mono">1.00</text>
    <text x="126" y="116" class="mono">0.50</text>
    <text x="178" y="116" class="mono">0.50</text>
    <text x="230" y="116" class="mono">0.50</text>
    <text x="282" y="116" class="mono">0.50</text>
    <text x="65" y="207" class="text">oracle</text>
    <text x="113" y="207" class="text">text</text>
    <text x="168" y="207" class="text">linear</text>
    <text x="226" y="207" class="text">MLP</text>
    <text x="278" y="207" class="text">SAE</text>
  </g>

  <g transform="translate(428,88)">
    <rect width="204" height="224" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="20" y="28" class="label">Same activation, two questions</text>
    <rect x="28" y="56" width="148" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="45" y="80" class="text">surface question -> positive</text>
    <rect x="28" y="122" width="148" height="44" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="47" y="146" class="text">motion question -> negative</text>
    <path d="M102 102 V120" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="42" y="198" class="mono">question-id flip rate = 1.00</text>
  </g>

  <g transform="translate(652,88)">
    <rect width="232" height="224" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="20" y="28" class="label">Controls</text>
    <rect x="22" y="52" width="186" height="30" rx="7" fill="#dcfce7" stroke="#16a34a"/>
    <text x="56" y="72" class="chip">OOD splits 4/4</text>
    <rect x="22" y="92" width="186" height="30" rx="7" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="43" y="112" class="chip">random abstain 1.00</text>
    <rect x="22" y="132" width="186" height="30" rx="7" fill="#fce7f3" stroke="#db2777"/>
    <text x="30" y="152" class="chip">confidence 0.356 <= 0.4</text>
    <rect x="22" y="172" width="186" height="30" rx="7" fill="#fee2e2" stroke="#dc2626"/>
    <text x="63" y="192" class="chip">patch 1 -> 0</text>
  </g>

  <rect x="36" y="334" width="848" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="356" class="subtitle">Model: gelu-1l | hook: blocks.0.hook_resid_post | rows/questions: 16/2 | peak VRAM: 0.269 GB | no LoRA/API benchmark claim</text>
