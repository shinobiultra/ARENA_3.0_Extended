<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Predictive Concept Decoder signature result</title>
  <desc id="desc">A compact summary of the accepted 7.5 CUDA preflight: PCD accuracy beats baselines, shuffled questions fail, concepts are stable, and top concept removal is more damaging than active control removal.</desc>
  <rect width="960" height="420" fill="#fbfbfe"/>
  <rect x="32" y="28" width="896" height="364" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="76" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Signature result: sparse concepts need the question</text>
  <text x="64" y="104" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Pinned TransformerLens gelu-1l preflight, final-token residual hook, RTX 5090 Laptop GPU.</text>

  <g font-family="Inter, Arial, sans-serif">
    <text x="76" y="154" font-size="13" font-weight="700" fill="#334155">Accuracy</text>
    <rect x="76" y="172" width="680" height="22" rx="6" fill="#e2e8f0"/>
    <rect x="76" y="172" width="680" height="22" rx="6" fill="#2563eb"/>
    <text x="768" y="189" font-size="13" font-weight="700" fill="#0f172a">PCD 1.00</text>

    <rect x="76" y="206" width="680" height="22" rx="6" fill="#e2e8f0"/>
    <rect x="76" y="206" width="340" height="22" rx="6" fill="#64748b"/>
    <text x="768" y="223" font-size="13" font-weight="700" fill="#0f172a">probe 0.50</text>

    <rect x="76" y="240" width="680" height="22" rx="6" fill="#e2e8f0"/>
    <rect x="76" y="240" width="340" height="22" rx="6" fill="#64748b"/>
    <text x="768" y="257" font-size="13" font-weight="700" fill="#0f172a">best baseline 0.50</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13">
    <rect x="76" y="304" width="184" height="56" rx="12" fill="#ecfdf5" stroke="#10b981"/>
    <text x="168" y="328" text-anchor="middle" font-weight="800" fill="#064e3b">sparse</text>
    <text x="168" y="348" text-anchor="middle" fill="#065f46">density 0.50</text>

    <rect x="282" y="304" width="184" height="56" rx="12" fill="#fff7ed" stroke="#f97316"/>
    <text x="374" y="328" text-anchor="middle" font-weight="800" fill="#7c2d12">shuffle fails</text>
    <text x="374" y="348" text-anchor="middle" fill="#9a3412">accuracy 0.00</text>

    <rect x="488" y="304" width="184" height="56" rx="12" fill="#eef2ff" stroke="#6366f1"/>
    <text x="580" y="328" text-anchor="middle" font-weight="800" fill="#312e81">stable</text>
    <text x="580" y="348" text-anchor="middle" fill="#4338ca">Jaccard 1.00</text>

    <rect x="694" y="304" width="184" height="56" rx="12" fill="#fdf2f8" stroke="#db2777"/>
    <text x="786" y="328" text-anchor="middle" font-weight="800" fill="#831843">removal</text>
    <text x="786" y="348" text-anchor="middle" fill="#9d174d">4.36 vs 0.64</text>
  </g>
</svg>
