<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">Mini Activation Oracle validation loop</title>
  <desc id="desc">A diagram showing activations and natural-language questions entering an oracle, then baseline, OOD, random activation, and patching controls.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 21px Inter, Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 12px Inter, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 13px Inter, Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 500 11px Inter, Arial, sans-serif; fill: #334155; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="920" height="340" fill="#f8fafc"/>
  <text x="28" y="36" class="title">A mini Activation Oracle answers questions about the same activation</text>
  <text x="28" y="58" class="subtitle">The key test is whether question conditioning adds information beyond text-only guesses and activation-only probes.</text>

  <g transform="translate(34,92)">
    <rect width="156" height="94" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="18" y="26" class="box-title">Activation</text>
    <text x="18" y="50" class="box-text">cached residual vector</text>
    <text x="18" y="66" class="mono">hook_resid_post</text>
    <text x="18" y="82" class="box-text">final token</text>
  </g>

  <g transform="translate(34,206)">
    <rect width="156" height="78" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="18" y="26" class="box-title">Question</text>
    <text x="18" y="50" class="box-text">"surface-like?"</text>
    <text x="18" y="66" class="box-text">"motion-like?"</text>
  </g>

  <g transform="translate(258,120)">
    <rect width="160" height="126" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="23" y="30" class="box-title">Question-conditioned</text>
    <text x="23" y="48" class="box-title">mini oracle</text>
    <text x="23" y="76" class="box-text">activation score</text>
    <text x="23" y="94" class="box-text">+ question embedding</text>
    <text x="23" y="112" class="box-text">-> answer logits</text>
  </g>

  <path class="arrow" d="M190 139 C218 139 226 161 254 161"/>
  <path class="arrow" d="M190 244 C218 244 226 205 254 205"/>

  <g transform="translate(494,78)">
    <rect width="158" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="18" y="25" class="box-title">Baselines</text>
    <text x="18" y="46" class="box-text">text-only and probes</text>
  </g>

  <g transform="translate(494,158)">
    <rect width="158" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="18" y="25" class="box-title">OOD splits</text>
    <text x="18" y="46" class="box-text">templates, names, length</text>
  </g>

  <g transform="translate(494,238)">
    <rect width="158" height="64" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="18" y="25" class="box-title">Random activations</text>
    <text x="18" y="46" class="box-text">abstain or stay uncertain</text>
  </g>

  <g transform="translate(720,158)">
    <rect width="158" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="18" y="25" class="box-title">Patch activations</text>
    <text x="18" y="46" class="box-text">clean answer -> corrupt answer</text>
  </g>

  <path class="arrow" d="M418 158 C452 122 456 110 490 110"/>
  <path class="arrow" d="M418 183 H490"/>
  <path class="arrow" d="M418 210 C452 250 456 270 490 270"/>
  <path class="arrow" d="M652 190 H716"/>

  <rect x="172" y="306" width="576" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="192" y="322" class="subtitle">If the oracle ignores the question id, it collapses into an ordinary activation probe.</text>
</svg>
