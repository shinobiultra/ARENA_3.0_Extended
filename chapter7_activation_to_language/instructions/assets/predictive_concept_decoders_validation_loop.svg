<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Predictive Concept Decoder validation loop</title>
  <desc id="desc">Residual activations are projected into sparse concepts, conditioned on a question, decoded into an answer, and checked with baseline, shuffle, stability, and removal controls.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="960" height="360" fill="#f8fafc"/>
  <rect x="28" y="28" width="904" height="304" rx="18" fill="#ffffff" stroke="#cbd5e1"/>

  <g filter="url(#shadow)">
    <rect x="60" y="96" width="150" height="104" rx="12" fill="#eef2ff" stroke="#6366f1"/>
    <rect x="250" y="96" width="150" height="104" rx="12" fill="#ecfdf5" stroke="#10b981"/>
    <rect x="440" y="96" width="150" height="104" rx="12" fill="#fff7ed" stroke="#f97316"/>
    <rect x="630" y="96" width="150" height="104" rx="12" fill="#fdf2f8" stroke="#db2777"/>
  </g>

  <text x="135" y="124" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e1b4b">Residual</text>
  <text x="135" y="146" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e1b4b">activation</text>
  <text x="135" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">final-token</text>
  <text x="135" y="190" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">gelu-1l residual</text>

  <text x="325" y="124" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#064e3b">Sparse</text>
  <text x="325" y="146" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#064e3b">concepts</text>
  <text x="325" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">ReLU + top-k</text>
  <text x="325" y="190" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">density checked</text>

  <text x="515" y="124" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#7c2d12">Question</text>
  <text x="515" y="146" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#7c2d12">conditioned</text>
  <text x="515" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">one concept slot</text>
  <text x="515" y="190" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">per question</text>

  <text x="705" y="124" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#831843">Answer</text>
  <text x="705" y="146" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#831843">decoder</text>
  <text x="705" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">tiny trained</text>
  <text x="705" y="190" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">linear head</text>

  <path d="M214 148 H244" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M404 148 H434" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M594 148 H624" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="792" y="76" width="108" height="144" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="846" y="105" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Controls</text>
  <text x="846" y="132" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#334155">baselines</text>
  <text x="846" y="153" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#334155">shuffle</text>
  <text x="846" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#334155">stability</text>
  <text x="846" y="195" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#334155">removal</text>
  <path d="M782 148 H792" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="80" y="250" width="800" height="46" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="480" y="279" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Course claim: a scoped sparse-concept PCD preflight, not a broad benchmark or semantic proof.</text>
</svg>
