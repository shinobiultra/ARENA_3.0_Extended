evidence_level: toy_lens_contract_plus_pinned_transformerlens_affine_lens_patchscope_preflight
claim_scope: 'GT-1 activation-to-language preflight: reusable toy logit-lens, tuned-lens,
  attention-lens, Patchscope, counterfactual, and random-activation contracts are
  kept for learner exercises, then a pinned TransformerLens gelu-1l checkpoint is
  loaded on CUDA. The report trains a ridge affine lens from hook_resid_pre to normalized
  hook_resid_post on safe cached prompts, evaluates held-out next-token decoding against
  the model''s own final predictions, runs an attention-lens diagnostic on a real
  head, patches source hook_resid_post activations into neutral target prompts and
  compares the decoded answers against unpatched text-only target prompts, and checks
  counterfactual plus low-confidence random-activation controls. This is a local
  lens/Patchscope mechanics preflight, not a released tuned lens benchmark.'
