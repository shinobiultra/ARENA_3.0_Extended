claim_scope: 'GT-1 mini Activation Oracle preflight: reusable toy activation-question,
  baseline-comparison, OOD, random-activation, and patching contracts are kept for
  learner exercises, then a pinned TransformerLens gelu-1l checkpoint is loaded on
  CUDA. The report builds a tiny trained question-conditioned oracle over real cached
  final-token residuals, asks two opposite behavioral questions of each activation,
  compares against text-only and independently trained activation-only probe baselines,
  verifies held-out template, new-name, long-context, and adversarial prompt splits,
  requires low-margin abstention on random activations, and checks that clean-to-corrupt
  activation replacement changes the oracle answer. This is a local mini-oracle preflight,
  not a LoRA-trained or API-backed Activation Oracle benchmark.'
