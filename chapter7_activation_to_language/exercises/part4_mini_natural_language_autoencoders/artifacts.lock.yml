evidence_level: exact_planted_semantic_ground_truth_plus_live_transformerlens_phrase_bottleneck_preflight
claim_scope: 'The learner-facing GT-0 result proves that a four-phrase compositional
  bottleneck recovers two planted semantic variables from held-out activations and
  preserves their exact downstream readout while prompt-only and opposite-phrase
  controls fail. Every visible prompt is paired with all four latent states, so the
  text-only information limit is exact. A pinned TransformerLens gelu-1l CUDA run
  remains supporting GT-3 evidence for a small residual phrase bottleneck. Neither
  result claims free-form explanation generation, discovery of unknown concepts,
  arbitrary residual reconstruction, or Anthropic-scale NLA training.'
