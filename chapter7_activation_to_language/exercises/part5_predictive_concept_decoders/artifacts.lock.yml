claim_scope: 'GT-3 Predictive Concept Decoder preflight: reusable toy question-batch,
  sparse encoding, question-conditioned decoder, baseline comparison, stability, removal,
  and concept-audit contracts are kept for learner exercises, then a pinned TransformerLens
  gelu-1l checkpoint is loaded on CUDA. The report builds signed sparse residual concepts
  from safe final-token activations, expands them into explicit concept-question interaction
  features, trains a tiny question-conditioned decoder on the train split, and evaluates
  four behavioral questions on held-out long-context prompts. It compares against trained
  question-agnostic sparse-concept, trained single-concept, and trained non-interaction
  activation+question baselines. It also checks concept sparsity, question-shuffle degradation,
  multi-seed top-concept stability, auditable top concept names, and active top-concept
  removal against a low-margin active-control removal. Legacy metric names still
  use random_removal for compatibility. This is a local PCD mechanics preflight,
  not a broad PCD benchmark or a full Activation Oracle comparison.'
