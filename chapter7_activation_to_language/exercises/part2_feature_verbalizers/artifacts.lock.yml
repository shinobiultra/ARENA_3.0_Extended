claim_scope: 'GT-1 feature-verbalizer preflight: reusable toy example-selection, keyword-prediction,
  counterexample, revision, intervention, and brevity contracts are kept for learner
  exercises, then a pinned TransformerLens gelu-1l checkpoint is loaded on CUDA. The
  report constructs a real residual direction from safe clean/corrupt final-token
  activations, scores safe prompt examples by projection onto that direction, validates
  a concise keyword explanation on held-out and contrastive examples, checks zero
  counterexamples, and verifies that adding the direction increases the predicted
  token logit difference. This is a local residual-direction verbalizer preflight,
  not an API-LLM or SAE-feature explanation claim.'
