evidence_level: exact_toy_oracles_plus_pinned_pythia_cuda_causal_intervention
claim_scope: >-
  A unit mean-difference direction fit only on layer-3 residual activations from
  24 regular Pythia-70m training prompts predicts grammatical number on 24
  unseen regular, irregular, and nonce prompts, but 548 of all 4,096
  pair-preserving label-swap nulls also reach accuracy 1.0 (p=0.134, p95=1.0),
  so decoding alone is not significant. A final-token-ID lookup is at chance.
  Replacing the direction component through a real block-3 hook changes
  downstream are-versus-is logits in both directions by 8.48 and 9.62, versus
  separate 64-direction coefficient-matched orthogonal p95 values 1.09 and
  1.85. The suffix rule remains perfect on regular and nonce rows and fails only
  on irregulars. Embedding and orthographic baselines expose lexical structure.
  Each causal direction must also beat 256 fixed-seed decoder directions fit
  from within-pair training-label swaps with the same per-example edit sizes;
  both Monte Carlo plus-one p-values must be below 0.05. This is causal sensitivity in a controlled prompt family, not
  a unique feature, complete agreement circuit, or general verbalization benchmark.
