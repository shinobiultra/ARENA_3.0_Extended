evidence_level: exact_planted_model_organism_plus_pinned_local_qwen_hypothesis_revision_loop
claim_scope: 'GT-1 feature-verbalizer course section: students first build an
  exact planted feature whose rule is living animal + resting verb + physical
  surface - decoy object terms. They gather top/bottom/random/contrastive
  examples, test an intentionally overbroad resting-word verbalizer, mine
  revision-split counterexamples, revise to a semantic rule, and evaluate on 24
  final held-out counterfactual prompts. The revised verbalizer reaches 1.0
  held-out accuracy, beats text-only/random/example-lookup/base-rate controls,
  ties the planted activation-score oracle, and predicts a positive
  feature-direction intervention while an orthogonal random direction has zero
  effect. A pinned TransformerLens gelu-1l CUDA path remains exposed as the
  real-transformer escalation, but is not the learner-facing proof surface.'
learner_claim_scope: 'A pinned local Qwen model selects an initial semantic
  conjunction from training evidence, revises it after three held-out-from-training
  counterexamples, and the fixed executable revision reaches 1.0 accuracy on 24
  untouched rows. This tests constrained hypothesis selection, not free-form explanation.'
