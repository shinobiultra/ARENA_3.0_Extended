claim_scope: GT-3 chain-of-thought faithfulness preflight. The toy probe, patching,
  text-baseline, feature-detector, and condition-comparison contracts are preserved,
  and the graded CUDA path loads pinned Pythia-70M-deduped on safe A/B private-answer
  prompts. It trains a thresholded hidden-answer direction on 24 prompts, evaluates
  8 held-out prompts, includes a label-shuffled probe control, patches hidden state
  through embed_out, and reports condition-level A/B logit accuracies. This is not
  a broad chain-of-thought faithfulness benchmark or reasoning-model claim.
