claim_scope: GT-3 emergent-misalignment detection preflight using benign proxy drifts
  only. The toy detector, crosscoder-style proxy alignment, mitigation, and early-warning
  contracts are preserved, and the graded CUDA path loads pinned Pythia-70M-deduped
  on safe generated prompt pairs. It trains a thresholded hidden-state drift direction
  on 36 prompts, evaluates 24 held-out prompts across five benign proxy kinds, compares
  label-shuffled and fixed random directions, aligns proxy feature scores with a safe
  next-token behavior proxy, and tests projection-style mitigation through the LM
  head. This is not a trained crosscoder, not a harmful finetune, not an emergent-misalignment
  reproduction, and not a claim about arbitrary unsafe behavior.
