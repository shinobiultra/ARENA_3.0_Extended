claim_scope: GT-3 white-box monitor preflight using safe generated eval records only.
  The toy dashboard, AUROC calibration, missed-failure, false-positive, and explanation-validation
  contracts are preserved, and the graded CUDA path loads pinned Pythia-70M-deduped
  on neutral vs safe failure-policy prompts. It trains a thresholded hidden-state
  monitor on 36 prompts, evaluates 24 held-out prompts across five benign failure
  kinds, compares against a real next-token pass/fail black-box proxy, checks label-shuffled
  and fixed random directions, and validates false-positive documentation. This is
  not a harmful-content monitor benchmark, not a broad safety monitor claim, and not
  a generated-completion evaluation.
