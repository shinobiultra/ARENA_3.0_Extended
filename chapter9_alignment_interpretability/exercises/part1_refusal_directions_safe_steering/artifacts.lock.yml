claim_scope: One pinned Qwen checkpoint and public prompt-category dataset. Training-only
  mean direction and threshold; all 15 development candidates precede frozen final
  evaluation. Student implementations cache decoder inputs, persist addition and residual-write
  ablation through greedy EOS generation, measure exact benign tasks and retain all
  random/permutation draws. Marker absence is neither safety nor answer correctness.
  This is a scoped study of the paper method, not the full original model/dataset/generation
  suite.
