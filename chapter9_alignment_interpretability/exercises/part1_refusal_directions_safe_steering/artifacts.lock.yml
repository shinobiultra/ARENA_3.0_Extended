limitations:
- One small model and a small English prompt-category dataset.
- The marker rubric has visible false positives and false negatives; absence is not
  safety or correctness.
- A training-label permutation nearly matches final ranking and some permutation interventions
  have substantial effects.
- Strong addition damages exact benign-task performance.
- Four capability templates and 48 generated tokens do not reproduce the paper full
  evaluation.
safety_notes:
- Sensitive benchmark prompt/completion text stays in memory; stored rows contain
  IDs, full hashes and measured outcomes.
- Benign prompts, generated text and token IDs remain visible for checking marker-rubric
  and exact-answer mistakes.
- Model parameters are unchanged by the interventions; the temporary hook context
  removes only its own handles.
