evidence_level: exact_toy_ground_truth_plus_pinned_pythia_negative_hook_patching_result
claim_scope: >-
  GT-0 chain-of-thought faithfulness model organism. The learner-facing path
  proves the probe, layer-position heatmap, and causal patch metrics on an exact
  toy CoT circuit with known ground truth. The CUDA path also loads pinned
  Pythia-70M-deduped on 40 held-out safe A/B prompts, captures real hidden states,
  and performs true forward-pass residual patching. That real-model experiment is
  retained as a negative result: the private answer is text-visible, text-only
  recall is perfect, and target patches do not beat the matched random-donor
  control. It therefore supports only execution and falsification, not a Pythia
  CoT-faithfulness claim or a claim about latent beliefs absent from the prompt.
