<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-label="Chain-of-thought faithfulness signature result">
  <rect width="920" height="300" fill="#f8fafc"/>
  <style>
    .title { font: 700 22px sans-serif; fill: #111827; }
    .subtitle { font: 14px sans-serif; fill: #475569; }
    .metric { font: 700 28px sans-serif; fill: #0f172a; }
    .label { font: 700 13px sans-serif; fill: #334155; }
    .small { font: 12px sans-serif; fill: #475569; }
    .card { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; }
    .good { fill: #dcfce7; stroke: #15803d; stroke-width: 1.4; rx: 8; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.4; rx: 8; }
  </style>
  <text x="30" y="38" class="title">Pinned Pythia-70M hidden-answer preflight</text>
  <text x="30" y="61" class="subtitle">Safe A/B private-answer prompts, no generated completions, CUDA report accepted</text>

  <rect x="32" y="88" width="156" height="78" class="good"/>
  <text x="52" y="123" class="metric">1.00</text>
  <text x="52" y="148" class="label">hidden-answer acc</text>

  <rect x="208" y="88" width="156" height="78" class="card"/>
  <text x="228" y="123" class="metric">0.50</text>
  <text x="228" y="148" class="label">final-answer agreement</text>

  <rect x="384" y="88" width="156" height="78" class="good"/>
  <text x="404" y="123" class="metric">0.00</text>
  <text x="404" y="148" class="label">label-shuffle acc</text>

  <rect x="560" y="88" width="156" height="78" class="good"/>
  <text x="580" y="123" class="metric">flip</text>
  <text x="580" y="148" class="label">hidden-state patch</text>

  <rect x="736" y="88" width="152" height="78" class="warn"/>
  <text x="756" y="123" class="metric">0.34</text>
  <text x="756" y="148" class="label">peak VRAM GB</text>

  <rect x="32" y="196" width="260" height="72" class="card"/>
  <text x="52" y="224" class="label">white-box vs text-only recall</text>
  <text x="52" y="248" class="small">detector 1.00 vs visible-text baseline 0.50</text>

  <rect x="330" y="196" width="260" height="72" class="card"/>
  <text x="350" y="224" class="label">held-out prompt split</text>
  <text x="350" y="248" class="small">24 train prompts, 8 held-out prompts</text>

  <rect x="628" y="196" width="260" height="72" class="card"/>
  <text x="648" y="224" class="label">claim boundary</text>
  <text x="648" y="248" class="small">hidden states and logits only, no CoT benchmark claim</text>
</svg>
