<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="Chain-of-thought faithfulness validation loop">
  <rect width="920" height="280" fill="#f8fafc"/>
  <style>
    .title { font: 700 22px sans-serif; fill: #111827; }
    .label { font: 700 14px sans-serif; fill: #111827; }
    .text { font: 13px sans-serif; fill: #374151; }
    .small { font: 12px sans-serif; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 7; }
    .control { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; rx: 7; }
    .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>
  <text x="30" y="36" class="title">[9.2] CoT faithfulness: from readable rationale to causal evidence</text>

  <rect x="32" y="72" width="150" height="82" class="box"/>
  <text x="52" y="100" class="label">Safe A/B prompts</text>
  <text x="52" y="123" class="text">hidden answer</text>
  <text x="52" y="143" class="text">visible rationale</text>

  <rect x="222" y="72" width="150" height="82" class="box"/>
  <text x="242" y="100" class="label">Hidden state</text>
  <text x="242" y="123" class="text">pre-final token</text>
  <text x="242" y="143" class="text">residual vector</text>

  <rect x="412" y="72" width="150" height="82" class="box"/>
  <text x="432" y="100" class="label">Probe readout</text>
  <text x="432" y="123" class="text">hidden answer acc</text>
  <text x="432" y="143" class="text">final agreement</text>

  <rect x="602" y="72" width="150" height="82" class="box"/>
  <text x="622" y="100" class="label">Patch state</text>
  <text x="622" y="123" class="text">move hidden answer</text>
  <text x="622" y="143" class="text">check logits flip</text>

  <rect x="222" y="190" width="150" height="62" class="control"/>
  <text x="242" y="217" class="label">Text baseline</text>
  <text x="242" y="239" class="small">visible words only</text>

  <rect x="412" y="190" width="150" height="62" class="control"/>
  <text x="432" y="217" class="label">Label shuffle</text>
  <text x="432" y="239" class="small">wrong labels fail</text>

  <rect x="602" y="190" width="150" height="62" class="control"/>
  <text x="622" y="217" class="label">Condition split</text>
  <text x="622" y="239" class="small">faithful / biased / post-hoc</text>

  <path d="M182 113 H222" class="arrow"/>
  <path d="M372 113 H412" class="arrow"/>
  <path d="M562 113 H602" class="arrow"/>
  <path d="M677 154 V190" class="arrow"/>
  <path d="M487 154 V190" class="arrow"/>
  <path d="M297 154 V190" class="arrow"/>

  <text x="780" y="98" class="label">Claim earned only if:</text>
  <text x="780" y="123" class="small">probe predicts hidden answer</text>
  <text x="780" y="143" class="small">patching changes answer logits</text>
  <text x="780" y="163" class="small">text-only baseline misses cases</text>
  <text x="780" y="183" class="small">label shuffle fails</text>
</svg>
