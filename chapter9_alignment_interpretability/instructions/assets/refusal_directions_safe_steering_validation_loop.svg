<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Refusal-direction validation loop</title>
  <desc id="desc">Safe inputs flow through candidate direction construction, held-out separation, steering interventions, controls, and an aggregate-only report. Failed controls loop back to data and direction design.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .accent { fill: #ecfdf5; stroke: #047857; }
      .warn { fill: #fff7ed; stroke: #c2410c; }
      .scope { fill: #eff6ff; stroke: #2563eb; }
      .title { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .text { font: 13px Arial, sans-serif; fill: #334155; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #c2410c; stroke-width: 1.7; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="360"/>
  <text class="title" x="28" y="34">Safe refusal-direction validation loop</text>
  <rect class="scope" x="28" y="50" width="864" height="38" rx="8"/>
  <text class="small" x="46" y="74">Scope: safe meta-prompts + public refusal/compliance pairs; prompt hashes and aggregate metrics only; no harmful procedural text saved.</text>

  <rect class="box" x="28" y="126" width="134" height="76"/>
  <text class="title" x="47" y="153">Safe inputs</text>
  <text class="text" x="47" y="176">labels, splits,</text>
  <text class="text" x="47" y="193">hashes</text>

  <rect class="box" x="196" y="126" width="144" height="76"/>
  <text class="title" x="217" y="153">Cache activations</text>
  <text class="text" x="217" y="176">final token plus</text>
  <text class="text" x="217" y="193">layer sweep</text>

  <rect class="box" x="374" y="126" width="150" height="76"/>
  <text class="title" x="394" y="153">Build direction</text>
  <text class="text" x="394" y="176">mean difference,</text>
  <text class="text" x="394" y="193">PCA/SVD check</text>

  <rect class="accent" x="558" y="126" width="144" height="76"/>
  <text class="title" x="578" y="153">Held-out test</text>
  <text class="text" x="578" y="176">accuracy, margin,</text>
  <text class="text" x="578" y="193">position control</text>

  <rect class="accent" x="736" y="126" width="156" height="76"/>
  <text class="title" x="758" y="153">Steer safely</text>
  <text class="text" x="758" y="176">addition and</text>
  <text class="text" x="758" y="193">projection-out</text>

  <rect class="warn" x="240" y="254" width="174" height="70"/>
  <text class="title" x="262" y="282">Negative controls</text>
  <text class="text" x="262" y="304">random directions,</text>
  <text class="text" x="262" y="321">label shuffles</text>

  <rect class="accent" x="514" y="254" width="174" height="70"/>
  <text class="title" x="536" y="282">Accepted report</text>
  <text class="text" x="536" y="304">aggregate-only</text>
  <text class="text" x="536" y="321">CUDA evidence</text>

  <path class="line" d="M162 164 H196"/>
  <path class="line" d="M340 164 H374"/>
  <path class="line" d="M524 164 H558"/>
  <path class="line" d="M702 164 H736"/>
  <path class="line" d="M814 202 C814 252 728 289 688 289"/>
  <path class="line" d="M414 289 H514"/>
  <path class="loop" d="M240 289 C116 284 85 232 95 202"/>
  <text class="small" x="62" y="247">failed controls return to data/direction design</text>
</svg>
