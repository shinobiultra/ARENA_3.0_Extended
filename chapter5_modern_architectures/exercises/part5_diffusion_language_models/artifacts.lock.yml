claim_scope: Exact copy warm-up and finite absorbing diffusion derivation, followed by a 90-cell own-answer
  text learner with three seeds, twelve matched fits, 126 final generation conditions, twelve visible
  figures and cached-AR timing. Frozen tasks are parentheses, addition, context-dependent QA and pinned
  TinyStories. All shuffled/untrained controls, late-checkpoint sensitivity and weak natural-text outputs
  remain visible. Separate CUDA refits four models and regenerates 42 seed-zero configurations. The DiffusionGemma
  NVFP4 artifact remains a one-prompt generation proof; released-model time-state capture and patching
  are unfinished.
