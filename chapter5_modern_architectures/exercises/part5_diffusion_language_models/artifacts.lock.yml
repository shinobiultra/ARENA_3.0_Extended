evidence_level: toy_diffusion_contract_plus_cuda_trained_conditional_diffusion_lm_and_diffusiongemma_readiness_preflight
claim_scope: 'GT-0 discrete diffusion language-model ladder: analytic noising, masked
  denoising loss, remasking, sampler, entropy, and trajectory helpers remain tested
  on toy fixtures, then a tiny Transformer denoiser is trained on CUDA for a generated
  conditional copy-pair grammar. The report checks held-out masked-token accuracy,
  confidence-remasking sampler reconstruction, activation trajectory shape, VRAM,
  and shuffled-label controls. The report also checks the pinned DiffusionGemma
  Transformers config, processor, tokenizer, model class, exact revisions, shard
  readiness, and vLLM/NVFP4 runtime readiness. It accepts released-checkpoint
  generation only from complete BF16 generation or from the pinned NVFP4 isolated-vLLM
  proof artifact; config-only evidence is never accepted as generation.'
