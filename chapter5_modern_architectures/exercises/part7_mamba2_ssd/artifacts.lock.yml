evidence_level: exact_ssd_duality_trained_causal_memory_and_full_pinned_130m_output_parity
claim_scope: >-
  GT-1 Mamba-2/SSD implementation contract: the learner implements stable segment
  sums, a semiseparable matrix, independent recurrent and quadratic SSD forms,
  chunked SSD, grouped multi-head parameters, a gated residual block, and exact
  convolution/SSM cache decoding, a stacked LM, and runnable parameter-matched
  attention and Mamba-1 controls. Float64 outputs, final states, and gradients agree with the
  literal recurrence and the official repository's SSD Listing 1. A trained tiny
  Mamba-2 mixer solves generated delayed recall while recurrent-state ablation,
  a finite local convolution, and shuffled-label training remain near chance.
  All 219 tensors from pinned Mamba-2 130M map strictly into a faithful from-scratch
  24-layer LM; 25 hidden states, logits, and top tokens match Transformers on two
  prompts. The strict CUDA release hook additionally compares against the official
  fused SSD kernel. The paper's optimized training-speed claim is not reproduced.
