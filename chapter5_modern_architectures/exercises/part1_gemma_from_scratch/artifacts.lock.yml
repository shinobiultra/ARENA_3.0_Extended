  are kept for learner exercises, then the local implementation is compared on CUDA
  against Hugging Face''s real transformers.GemmaForCausalLM reference architecture
  with a deterministic tiny config and matched random weights. The report requires
  all reference state-dict keys to load, close logit parity, top-k agreement, cache
  parity, the Gemma embedding normalizer, and measured VRAM. This proves architecture
  parity; it does not claim validation on gated pretrained Gemma weights.'
