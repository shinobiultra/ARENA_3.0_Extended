claim_scope: 'GT-1 Mamba implementation contract: the learner implements stable
  continuous-time discretization, causal depthwise convolution, token-dependent delta/B/C,
  recurrent and associative selective scans, a gated pre-norm residual Mamba block,
  recurrent cache, and a stacked tied-embedding LM. On CPU, all 243 tensors from pinned
  Mamba-130M-HF map strictly with no missing or unexpected keys; 25 hidden-state checkpoints,
  final logits, cache logits, and greedy tokens match the official implementation within
  explicit tolerances. The exact selective-memory signature compares recurrent state with
  causal-attention and finite-convolution controls. CUDA fast-kernel throughput and VRAM
  remain a separate release contract and were not rerun for this learner-surface rewrite.'
