evidence_level: exact_toy_ground_truth_plus_three_seed_negative_result
evaluation_protocol: vjepa-14.3-paper-l1-tube-mask-v4
claim_scope: >-
  A student-built tubelet V-JEPA optimizes target-normalized, stop-gradient L1
  prediction under spatial masks repeated through time and an EMA teacher. A
  separate full-future mask is an out-of-distribution stress test. Across three
  CPU seeds, copy-last-frame exceeds V-JEPA on observed mean teacher-latent
  cosine and retrieval, while exact dynamics reaches 1.0. Canonical reversed
  keys have zero overlap with pretraining, probe-fit, and forward test keys.
  The result does not establish learned dynamics beyond persistence.
  Blanking all future pixels also exceeds learned retrieval on the observed
  mean, exposing context carryover in the teacher's final-slice representations.
