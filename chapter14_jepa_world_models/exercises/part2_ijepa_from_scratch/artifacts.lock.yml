notebook_id: 14_2_ijepa_from_scratch
section: '14.2'
title: I-JEPA from Scratch
exercise_metadata:
  EXERCISE_ID: 14_2_ijepa_from_scratch
  GT_TIER: GT-0
  DIFFICULTY: 4
  IMPORTANCE: 5
  EXPECTED_RUNTIME: 120-180 minutes; under one minute for the full CUDA verification
  REQUIRES_GPU: true
gt_tier: GT-0
evidence_level: cuda_verified_exact_predictive_world
claim_scope: >-
  A small I-JEPA trained from scratch on an exact generated image world uses a
  visible class-colour key to predict the target latent of a fully masked object
  on pixel-distinct scenes sharing all twelve semantic templates. Correct context recovers object class, while a
  key-only cyclic replacement changes the prediction to the alternate key class
  while every other pixel remains fixed. Erasing the image-space key reduces
  accuracy to chance, zero latent context raises loss, and an untrained architecture remains at chance.
  A matched jointly optimized target ablation attains very low latent loss while
  compressing feature spread and weakening held-out prediction. Linear probes
  are explicitly not evidence here because random encoder features already
  decode this easy world. This is not an ImageNet or checkpoint-parity claim.
required_gpu_gb: 1
max_allowed_gpu_gb: 24
models:
  - id: course_tiny_ijepa_v2
    source: trained_from_scratch
    revision: exact_architecture_in_solutions_py
    precision: float32
    gated: false
datasets:
  - id: course_generated_ijepa_predictive_key_world_v2
    source: deterministic_tensor_generator
    train_seeds: [0, 1, 2]
    evaluation_seeds: [50000, 50001, 50002]
    examples_per_seed_per_split: 120
    shared_semantic_templates: 12
    image_size: 32x32
    object_classes: 3
    position_classes: 4
    object_radius_pixels: 3
    production_jitter_pixels: 0
    key_patch: rows_0_3_columns_12_15
    object_labels_used_in_loss: false
    position_labels_used_for_target_selection: true
    exact_train_evaluation_overlap: 0
