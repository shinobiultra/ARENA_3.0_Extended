notebook_id: 14_4_maze_transformers_and_latent_planning
section: '14.4'
title: 'Maze Transformers: Policies, Probes, and State Patching'
exercise_metadata:
  EXERCISE_ID: 14_4_maze_transformers_and_latent_planning
  GT_TIER: GT-3
  DIFFICULTY: 5
  IMPORTANCE: 5
  EXPECTED_RUNTIME: 2-3 hours; under five minutes for full CUDA verification
  REQUIRES_GPU: true
gt_tier: GT-3
evidence_level: exact_bfs_ground_truth_plus_trained_transformer_and_causal_route_state_patching
claim_scope: >-
  A small decoder-only transformer trained from scratch on exact BFS policy labels
  learns a usable next-action policy on disjoint generated 5x5 wall layouts. Its
  query-position residual stream supports held-out distance/legal-degree/action probes,
  and a counterfactual same-maze route-state patch changes next-action logits more
  than wrong-position and matched-norm random patches. Legal-action-constrained
  rollouts are reported separately from raw decoding. This does not establish
  natural-language planning, large-maze search, or a complete planning circuit.
  Manhattan distance bins beat the learned distance probe, and same-action donors
  from other mazes match or exceed targeted donors in the checked CPU experiment.
  Internal search and route-specific representations are not established.
required_gpu_gb: 1
max_allowed_gpu_gb: 24
reproducibility:
  cublas_workspace_config: ':4096:8'
  deterministic_cuda_algorithms: true
  float32_matmul_precision: highest
models:
  - id: course_tiny_maze_decoder_transformer_v1
    source: trained_from_scratch
    revision: architecture_in_solutions_py
    precision: float32
    gated: false
datasets:
