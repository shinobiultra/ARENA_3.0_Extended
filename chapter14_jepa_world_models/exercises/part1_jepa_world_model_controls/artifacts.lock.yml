claim_scope: GT-1 toy JEPA/world-model controls plus pinned V-JEPA 2 ViT-L frozen-latent
  world-model controls on deterministic generated videos. The real model path verifies
  finite non-collapsed video features, trains a masked latent predictor from occluded
  to visible states, probes held-out object state above a shuffled-label baseline,
  trains an action-conditioned latent rollout head that beats copy and shuffled-action
  baselines, tests occluded-vs-absent object permanence, and performs causal latent-token
  patching against same-size random-token patches. It does not fine-tune V-JEPA or
  claim a real-video benchmark replication.
