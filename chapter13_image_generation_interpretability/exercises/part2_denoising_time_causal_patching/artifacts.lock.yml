gt_tier: GT-0
evidence_level: cuda_verified_toy_ground_truth_and_pinned_sd15_latent_patching
claim_scope: >-
  A fully specified generated image world validates analytic forward noising,
  end-to-end denoiser training, layer-by-timestep activation caching, and causal
  replacement at an exact object-feature bottleneck. The executed signature
  transfers a red square into a matched-seed blue-circle trajectory and beats
  equal-size channel, location, timestep, shuffled-label, unpatched, and
  untrained-model controls. A pinned SD1.5 CUDA experiment additionally sweeps
  all 19 non-initial DDIM intervention times for two same-seed color
  counterfactuals and shows the selected donor-latent patch beating unpatched,
  wrong-time, wrong-region, and scale-matched random-latent controls. This is a
  scoped latent-state color-transfer result, not a full UNet circuit claim.
