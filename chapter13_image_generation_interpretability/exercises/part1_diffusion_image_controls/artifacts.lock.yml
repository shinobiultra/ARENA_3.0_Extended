safety_notes:
- No unsafe prompts, unsafe adapters, raw gated weights, or large data artifacts.
- The real-model paths use safe generated shape prompts only. The required SD1.5 path
  captures cross-attention maps for color/shape token localization over unrelated-token
  controls, compares target-token ablation against random/control-token ablation,
  checks simple generated image-quality statistics, and rejects white-noise images.
  SD-Turbo remains a supplemental fast preflight, not the acceptance fallback.
