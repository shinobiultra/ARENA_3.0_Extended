claim_scope: GT-1 toy diffusion/image-generation interpretability controls plus a
  required pinned safetensors Stable Diffusion 1.5 safe-shape preflight. The SD1.5
  path captures DAAM-style cross-attention maps for color/shape tokens, verifies target-token
  attention over generated color regions against unrelated-token controls, ablates
  target prompt tokens over random/control-token ablations, preserves simple image-quality
  metrics, rejects white-noise controls, and scores generated images with pinned CLIP.
  The learner notebook renders the generated images, measured attention overlays,
  same-seed counterfactuals, white-noise failures, and metric controls directly. A
  pinned SD-Turbo/CLIP attention preflight remains supplemental.
