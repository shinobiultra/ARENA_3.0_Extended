<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc">
  <title id="title">Signature result for CLIP, SigLIP, and VLM controls</title>
  <desc id="desc">A table-style visualization showing toy CLIP and SigLIP checks, real CLIP and SigLIP retrieval, hidden visual-token object patch gaps, and scoped Qwen2.5-VL rendered-shape answers.</desc>
  <rect width="920" height="410" fill="#fbfcfe"/>
  <style>
    .title { font: 700 24px sans-serif; fill: #172033; }
    .label { font: 600 15px sans-serif; fill: #223044; }
    .value { font: 700 15px sans-serif; fill: #111827; }
    .small { font: 13px sans-serif; fill: #516174; }
    .grid { stroke: #d6dde8; stroke-width: 1; }
    .good { fill: #dff4e7; }
    .neutral { fill: #e8f1ff; }
  </style>
  <text x="40" y="42" class="title">CLIP/SigLIP controls: diagonal retrieval plus causal-style checks</text>
  <text x="40" y="70" class="small">Toy implementation contract plus pinned CUDA report on RTX 5090 Laptop GPU, PyTorch CUDA 13.2.</text>
  <rect x="40" y="100" width="840" height="250" rx="8" fill="#ffffff" stroke="#c9d4e2"/>
  <line x1="40" y1="148" x2="880" y2="148" class="grid"/>
  <line x1="40" y1="192" x2="880" y2="192" class="grid"/>
  <line x1="40" y1="236" x2="880" y2="236" class="grid"/>
  <line x1="40" y1="280" x2="880" y2="280" class="grid"/>
  <line x1="40" y1="324" x2="880" y2="324" class="grid"/>
  <line x1="380" y1="100" x2="380" y2="350" class="grid"/>
  <line x1="605" y1="100" x2="605" y2="350" class="grid"/>
  <line x1="745" y1="100" x2="745" y2="350" class="grid"/>
  <text x="62" y="130" class="label">Check</text>
  <text x="492" y="130" text-anchor="middle" class="label">Metric</text>
  <text x="674" y="130" text-anchor="middle" class="label">Control</text>
  <text x="812" y="130" text-anchor="middle" class="label">Verdict</text>
  <rect x="381" y="149" width="223" height="42" class="good"/>
  <text x="62" y="175" class="label">Toy CLIP diagonal margin</text>
  <text x="492" y="175" text-anchor="middle" class="value">5.000</text>
  <text x="674" y="175" text-anchor="middle" class="small">strongest negative</text>
  <text x="812" y="175" text-anchor="middle" class="small">passes</text>
  <rect x="381" y="193" width="223" height="42" class="good"/>
  <text x="62" y="219" class="label">Toy SigLIP pairwise loss</text>
  <text x="492" y="219" text-anchor="middle" class="value">0.033</text>
  <text x="674" y="219" text-anchor="middle" class="small">positive and negative pairs</text>
  <text x="812" y="219" text-anchor="middle" class="small">passes</text>
  <rect x="381" y="237" width="223" height="42" class="good"/>
  <text x="62" y="263" class="label">Real CLIP / SigLIP retrieval</text>
  <text x="492" y="263" text-anchor="middle" class="value">1.0 / 1.0</text>
  <text x="674" y="263" text-anchor="middle" class="small">rendered-shape pairs</text>
  <text x="812" y="263" text-anchor="middle" class="small">passes</text>
  <rect x="381" y="281" width="223" height="42" class="neutral"/>
  <text x="62" y="307" class="label">Hidden-token object patch gap</text>
  <text x="492" y="307" text-anchor="middle" class="value">14.93 / 31.45</text>
  <text x="674" y="307" text-anchor="middle" class="small">background/random controls</text>
  <text x="812" y="307" text-anchor="middle" class="small">scoped evidence</text>
  <rect x="381" y="325" width="223" height="24" class="good"/>
  <text x="62" y="342" class="label">Qwen2.5-VL answers</text>
  <text x="492" y="342" text-anchor="middle" class="value">red square / blue circle</text>
  <text x="674" y="342" text-anchor="middle" class="small">safe rendered objects</text>
  <text x="812" y="342" text-anchor="middle" class="small">passes</text>
  <text x="40" y="384" class="small">Claim: the control ladder works on toy and pinned rendered-shape checks. Non-claim: broad VLM hallucination or visual-token-flow interpretability is solved here.</text>
</svg>
