claim_scope: Full pixel and caption encoders trained with CLIP and SigLIP on 576 images,
  evaluated on 288 independent instances of twelve shared classes across three seeds,
  with frozen-tower, shuffled-pair, blank, noise and wrong-word controls. Pretrained
  CLIP zero-shot classification and matched typographic overlays on 48 rendered scenes.
  GT-1 pinned CLIP and SigLIP rendered-shape retrieval plus real object-region
  counterfactual patching, real hidden visual-token activation patching at the vision
  patch-embedding output with object/background/same-size random-token/full-sequence
  controls, a pinned Qwen2.5-VL 3B rendered-shape generation check, and a controlled
  synthetic VLM object/color/clothing-style ladder with counterfactual labels, joint/image-only
  baselines over text-only priors, and object-region patching against background and
  same-size random controls.
