safety_notes:
- No unsafe prompts, unsafe adapters, raw gated weights, or large data artifacts.
- The real generative VLM path uses safe generated shape images only. The CLIP and
  SigLIP region-patching path uses deterministic rendered shape images with object,
  background, and same-size non-overlapping random-region patch controls. The hidden-token
  path patches real CLIP/SigLIP visual-token activations at `vision_model.embeddings`
  and requires object tokens to flip the contrastive answer while background, same-size
  random-token, and full visual-sequence controls behave as expected. The Qwen2.5-VL
  path verifies grounded generation on the same safe rendered objects.

