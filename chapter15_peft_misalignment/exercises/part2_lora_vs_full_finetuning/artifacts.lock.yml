notebook_id: 15_2_lora_vs_full_finetuning
section: '15.2'
title: LoRA vs Full Finetuning on a Real Transformer
exercise_metadata:
  EXERCISE_ID: 15_2_lora_vs_full_finetuning
  GT_TIER: GT-1
  DIFFICULTY: 4
  IMPORTANCE: 4
  EXPECTED_RUNTIME: under two minutes for bounded CPU preflight; minutes for full CUDA comparison
  REQUIRES_GPU: true
gt_tier: GT-1
evidence_level: pinned_pretrained_transformer_matched_peft_and_full_finetuning_comparison
claim_scope: >-
  A pinned 3.7M-parameter pretrained TinyStories GPT-Neo model is adapted on a safe
  generated marker-to-color next-token task with disjoint held-out templates.
  Rank-1 LoRA, rank-4 LoRA, and full-model finetuning use the same examples, batches,
  step counts, objective, and protected-task replay, with explicit method-specific
  learning rates. The learner compares behavior, selected real-transformer update
  spectra, layer-6 activation drift, and causal removal of the dominant adapter-induced
  direction against base, random-label, same-norm random low-rank, and random-direction
  controls. This is template-generalization evidence, not a broad PEFT equivalence claim.
required_gpu_gb: 2
max_allowed_gpu_gb: 24
