schema_version: 1
allowed_statuses:
  - open
  - met
  - deferred

# The 205 Extension-Roadmap requirements and where each stands. This file is the only place a
# requirement's status lives; the syllabus `requirements:` lists (infrastructure/extension/syllabus.yaml)
# are the only mapping from requirements to sections. Neither status nor ids appear on learner pages.
#   open      not met yet; `note` says what is missing (or what the lesson already does).
#   met       the lesson the syllabus maps it to is `finished` and has the learner implement and run
#             what `topic` names; the six original-ARENA rows are met by chapters 0-4 and say where.
#   deferred  an outside limit stops it: `deferred_reason` is hardware (more than one 24 GB GPU),
#             upstream (weights, code, data or an Alchemy unit not released or stable) or optional
#             (the roadmap marks it optional); `deferred_until` is the checkable condition to revisit.
# Who moves a status (Spec #39, RQ10): only the user moves a row toward a bigger claim (open -> met in
# the same commit that sets its section to finished, open -> deferred, narrowing, remapping). Anyone may
# move it toward a smaller one (met -> open with its section, deferred -> open once the trigger fires).
# A batch agent proposes one line per mapped requirement in its merge description and never flips one.
