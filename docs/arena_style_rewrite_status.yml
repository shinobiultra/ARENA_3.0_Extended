  '16.1':
    status: course_ready
    page: chapter16_shapley_attribution_baselines/instructions/pages/01_[16.1]_Exact_Shapley_on_Ground_Truth_Games.md
    notes: "ARENA-style exact-Shapley lab with a complete four-player dividend game, student implementations of coalition tables, exact factorial weighting, permutation averaging, efficiency, marginal-context distributions, and leave-one-out controls, plus immediate semantic tests, expected/help/solution/interpretation dropdowns, a play cell, and anomaly hunting. The visible signature result matches exact Shapley to the dividend oracle at [1.90, 0.60, 1.05, 0.55] while leave-one-out overcounts interactions; the interaction sweep and additive control explain the failure mechanistically. Sixteen focused tests pass and all 11 solution code cells execute. CUDA 13.2 verification trains a neural coalition game on all 16 coalitions, recovers exact Shapley within 9.38e-7 with zero efficiency error, rejects a shuffled-label attribution with error 4.63, and peaks at 0.063 GB under Torch 2.12.1+cu132. Claims are limited to complete finite-domain method validation, not approximate SHAP on large models."
  '16.2':
    status: course_ready
    page: chapter16_shapley_attribution_baselines/instructions/pages/02_[16.2]_KernelSHAP_and_PartitionSHAP_Controls.md
    notes: "ARENA-style seven-exercise KernelSHAP/PartitionSHAP lab with an exact six-player dividend game, learner-implemented constrained regression and Owen values, immediate semantic tests, expected/help/solution/interpretation dropdowns, a three-panel signature result, parameterized budget/seed/partition play, and anomaly hunting. Full-table KernelSHAP matches exact Shapley within 5.55e-16; at budget 24 the paired-kernel sampler has 0.242 mean max error versus 0.477 uniform, while shuffled values give 0.994 error. The aligned partition has zero error, a fixed misaligned partition has 0.300, and 91/100 random balanced partitions differ from exact Shapley. Ten focused tests and all 11 solution cells pass. CUDA 13.2 trains a four-player neural coalition game, recovers exact KernelSHAP/PartitionSHAP within 9.38e-7, rejects shuffled attributions by 4.63, and peaks at 0.063 GB VRAM. Limits include the exact 64-coalition organism, illustrative rather than optimal sampling, and supplied rather than learned partitions."
  '16.3':
    status: course_ready
    page: chapter16_shapley_attribution_baselines/instructions/pages/03_[16.3]_Shapley_Interactions_with_shapiq.md
    notes: "ARENA-style Shapley-interaction lab with seven learner exercises, complete coalition-table ground truth, local SII and permutation-sampling implementations, immediate semantic tests, expected/help/solution/interpretation dropdowns, a four-panel signature result, parameterized interaction play, and higher-order anomaly hunting. The planted pair has SII 3.0, rises to 4.0 under a known triple term, and all off-target/additive-control interactions are below 1e-9; pinned shapiq parity is within 6.75e-9. Sampling MAE falls from about 0.70 at budget 2 to 0.039 at 256, while within-size value permutation remains wrong by 3.88 and large individual Shapley values identify the wrong pair. Fifteen focused tests and all 13 solution cells pass. CUDA 13.2 trains a neural coalition game, recovers positive and negative interactions within 4.52e-7, matches shapiq within 1.18e-8, rejects shuffled interactions by 4.38, and peaks at 0.063 GB VRAM."
  '16.4':
    status: course_ready
    page: chapter16_shapley_attribution_baselines/instructions/pages/04_[16.4]_TokenSHAP_and_TokenShapley.md
    notes: "ARENA-style TokenSHAP lab with student implementations of position-preserving masking, complete coalition scoring, exact and sampled Shapley, pairwise redundancy/synergy diagnostics, grouped-player attribution, correlated-support ambiguity, and seed-distribution convergence. Eleven focused tests pass and all 13 solution code cells execute with expected/help/solution/interpretation dropdowns, play cells, and anomaly hunting. The six-panel signature result assigns exact credit [0, 0.3333, 0.3333, 1.5, 6.8333] summing to 9 while leave-one-out sums to 12; at 1024 permutations the 40-seed mean/p90 max errors are 0.0539/0.0904. Random-token and shuffled-value controls fail visibly, word versus subword grouping changes transfer credit from 6.8333 to 7.6667, and two games identical on observed support differ off-manifold and in attribution. CUDA 13.2 verification trains a tiny token scorer on all 16 coalitions, recovers exact values within 1.34e-7, rejects the shuffled control by 1.67, and peaks at 0.063 GB under Torch 2.12.1+cu132. Claims remain finite-game method validation, not faithful attribution for a large language model."
