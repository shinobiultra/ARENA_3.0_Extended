  '5.1':
    status: course_ready
    page: chapter5_modern_architectures/instructions/pages/01_[5.1]_Gemma_from_Scratch.md
    notes: Eight-exercise ARENA build from RMSNorm and RoPE through grouped-query attention, SwiGLU, a complete two-layer causal LM, KV-cache decoding, and activation tracing. The visible signature localizes the first divergence caused by removing embedding scaling or RoPE and by scrambling GQA order, while the exact implementation stays at zero trace error. CUDA verification loads all 21 matched weights into transformers GemmaForCausalLM, reaches 6.88e-05 maximum logit error, full top-5 and greedy-generation agreement, and cache parity within tolerance.
  '5.2':
    status: course_ready
    page: chapter5_modern_architectures/instructions/pages/02_[5.2]_Gemma_Scope_and_Feature_Steering.md
    notes: "ARENA-style sparse-feature progression with visible JumpReLU, reconstruction, held-out discovery, steering, and progressive-ablation exercises; immediate semantic tests; expected/help/solution/interpretation dropdowns; parameterized play cells; and anomaly hunting. The exact organism gives held-out AUC 1.000 versus 0.500 nuisance features and 0.498 across 200 label shuffles, while selected-feature steering reaches delta 2.000 and full ablation removes the target score. CUDA 13.2 verification uses authenticated google/gemma-3-1b-it plus the pinned Gemma Scope layer-13 width-16k SAE: feature 15586 reaches held-out AUC 1.000 versus random feature 0.500, the label-shuffle control fails, and peak VRAM is 2.236 GB. Seven focused tests and all 13 solution cells pass. The real claim is limited to an eight-plus-eight benign technical-versus-narrative probe and DLA-aligned logit contrast, not monosemanticity, broad feature coverage, safety behavior, or generation quality."
  '5.3':
    status: course_ready
    page: chapter5_modern_architectures/instructions/pages/03_[5.3]_Mamba_from_Scratch.md
    notes: "ARENA-style eleven-exercise build from exact recurrent and associative selective scans through causal depthwise convolution, input-dependent delta/B/C, gated residual blocks, a stacked language model, recurrent cache, and a full released-weight mapping. Immediate semantic tests, expected/help/solution/interpretation dropdowns, a parameterized play cell, common bugs, and anomaly hunting accompany the visible state-memory signature. The exact organism retains a written value across 32 distractors with zero error, while its real width-8 causal convolution reaches error 1.0 and recurrent-state ablation removes the readout. Seventeen focused tests and all 17 solution cells pass. All 243 tensors from pinned state-spaces/mamba-130m-hf map into the learner model; CPU hidden/logit maximum errors are 9.918e-05/1.221e-04 with exact top-1 and greedy-token agreement. CUDA 13.2 verification confirms fused kernels, 1.000 batched/single top-token agreement, scan/cache errors 4.77e-7/9.54e-7, 15.89 generated tokens/s, and 0.278 GB peak VRAM. The analytic all-context attention curve is a retrieval ceiling, not a trained Transformer comparison."
  '5.4':
    status: course_ready
    page: chapter5_modern_architectures/instructions/pages/04_[5.4]_Mamba_State_Tracking.md
    notes: Thirteen-cell ARENA progression from exact bracket-depth trajectories through tiny-Mamba training, recurrent-state extraction, controlled probes, matched cache transplants, and OOD anomaly hunting. The visible result shows 0.974 ID and 0.933 length-32 accuracy, probe degradation from 0.936 ID to 0.707 late OOD versus 0.350 shuffled labels, and exact donor-trajectory transfer versus a failed matched-norm random edit. CUDA verification adds a tiny-Transformer comparison, learned state intervention, and pinned Mamba-130M hidden-state extraction through available fast kernels.
  '5.5':
    status: course_ready
    page: chapter5_modern_architectures/instructions/pages/05_[5.5]_Diffusion_Language_Models.md
    notes: "The 90-cell learner retains the exact copy warm-up and adds thirteen text implementation groups (23 total), immediate semantic checks, twelve inspected figures, clear uncertainty colors and four play cells. All 43 own-answer code cells pass in 432.09 seconds from unchanged sources. Twelve fits, 126 conditions and 64,512 generated examples retain every seed and control. Fresh CUDA refits four models, reproduces all 21,504 seed-zero examples and checkpoint/trace states exactly in 139.65 seconds at 0.127 GiB text-model peak. Arithmetic improves over shuffled supervision; grammar favors AR and QA remains weak. Story continuations are visibly repetitive and reference similarity is not correctness. DiffusionGemma remains a separate inference preflight."
  '5.6':
    status: course_ready
    page: chapter5_modern_architectures/instructions/pages/06_[5.6]_Multimodal_Embedding_and_Function_Calling_Models.md
    notes: "ARENA-style embedding-router progression from masked pooling and cosine retrieval through confidence/margin abstention, tool availability, and separately scored routing behavior. The visible exact organism reaches 1.0 tool and abstention accuracy with zero hallucinations; a shuffled-schema control has 0.0 tool accuracy, while always-call has 0.0 abstention accuracy and 1.0 hallucination rate. Ten focused tests and all 11 solution cells pass, with expected/help/solution/interpretation dropdowns, parameterized play cells, and anomaly cases. CUDA 13.2 verification gives 4/4 top-1 and MRR 1.0 for both authenticated EmbeddingGemma and pinned BGE while permuted pairs score 0.0; pinned FunctionGemma parses and names all 32 held-out Mobile Actions calls correctly, with 0.875 exact/required argument accuracy and four disclosed failures. Authenticated base FunctionGemma forward also passes; peak VRAM is 1.312 GB. Limits include the hand-declared toy lexicon, uncalibrated abstention thresholds, and no compositional or real-model abstention slice."
