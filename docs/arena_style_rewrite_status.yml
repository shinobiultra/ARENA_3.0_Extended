  '6.1':
    status: course_ready
    page: chapter6_sparse_feature_methods/instructions/pages/01_[6.1]_SAE_Variants.md
    notes: "ARENA-style comparison of ReLU-L1, TopK, gated, and JumpReLU SAEs with six control-bearing panels, seven tested learner exercises, inline encoder/objective/metric/intervention implementations, expected/help/solution/interpretation dropdowns, parameter sweeps, and anomaly hunting. On exact planted sparse ground truth, all variants beat the train-mean reconstruction baseline, held-out AUCs are 0.884-0.946 versus shuffled labels near 0.5, causal steering is 0.445-0.731 versus numerical-zero orthogonal controls, and the lowest reconstruction error does not imply the best dictionary recovery. Seven focused tests and all 13 solution cells pass. CUDA 13.2 verification trains a width-256 TopK-16 SAE on pinned Pythia-70M hidden states: held-out MSE 1.134 versus zero 1.375, permuted-decoder MSE ratio 1.436, exact L0 16, safe-logit delta 1.478 versus near-zero orthogonal projection, and 0.391 GB peak VRAM. No individual feature cleanly separates the train or topic-disjoint held-out labels (AUC 0.641/0.438); this is preserved as a negative result, so the real path claims SAE mechanics rather than semantic feature interpretation."
  '6.2':
    status: course_ready
    page: chapter6_sparse_feature_methods/instructions/pages/02_[6.2]_Gemma_Scope_Deep_Dive.md
    notes: "ARENA-style Gemma Scope lab with eight progressive exercises, visible exact implementations, immediate semantic tests, expected/help/solution/interpretation dropdowns, parameter play, anomaly hunting, and a four-panel validation signature. On the exact six-feature organism, reconstruction MSE is below 1.5e-15, target held-out AUC is 1.0 versus 0.5 for random-feature and shuffled-label controls, the planted train-only confound collapses from AUC 1.0 to 0.5 held out, and target ablation changes the readout by 1.15 versus 0.0 for the matched control. Ten focused tests and all 16 solution cells pass. CUDA 13.2 verification authenticates pinned Gemma 3 1B IT and the layer-13 width-16K Gemma Scope 2 JumpReLU artifact, obtains held-out feature AUC 1.0 versus random-feature AUC 0.5 and label-shuffle AUC 0.0, and peaks at 2.236 GB. The real result uses only 16 benign prompts and has no real-model causal intervention, so its semantic claim remains narrow and correlational."
  '6.3':
    status: course_ready
    page: chapter6_sparse_feature_methods/instructions/pages/03_[6.3]_Transcoders_and_Attribution_Graphs.md
    notes: "ARENA-style transcoder and attribution-graph lab with six core exercises, immediate semantic tests, visible encoder/decoder/decomposition/edge/graph/intervention implementations, expected/help/solution/interpretation dropdowns, a color-and-shape play cell, anomaly localization, and two signature figures. The exact ReLU organism recovers its known ten-edge graph with zero reconstruction and edge-decomposition error; faithfulness at k=1/2/3 is 0.781/0.906/1.000 versus 0.000/0.000/0.094 for a same-size random graph, full-graph ablation damage is 1.0 versus 0.094, and exact versus shuffled-edge conservation is 1.0 versus 0.0. Eight focused tests and all 13 solution cells pass. CUDA 13.2 verification loads pinned TransformerLens gelu-1l, preserves the oracle MLP output and logits within 5.72e-6 and 1.81e-5, trains a width-512 transcoder with held-out MSE ratio 0.150 and top-1 agreement 0.904, and measures top-feature damage 0.808 versus 0.000646 for low-effect features at 0.369 GB peak VRAM. This is a one-layer real-model preflight, not a published cross-layer-transcoder replication."
  '6.4':
    status: course_ready
    page: chapter6_sparse_feature_methods/instructions/pages/04_[6.4]_Crosscoders_and_Model_Diffing.md
    notes: "ARENA-style learned-crosscoder lab with exact paired-activation ground truth, seven visible exercises, inline solved implementations, immediate semantic tests, expected/help/solution/interpretation dropdowns, parameterized sparsity play, and anomaly hunting. The 256-example held-out signature reaches reconstruction MSE 0.000183 versus zero baseline 0.1602, ownership accuracy 1.000 with minimum planted-feature correlation 0.9833, behavior AUC 0.9689 versus label-shuffle 0.5436, and targeted-ablation reduction 0.8341 versus same-norm and orthogonal reductions -0.1077 and -0.0965. CUDA 13.2 verification loads pinned TransformerLens GELU-1L and SoLU-1L revisions, obtains real residual-delta AUC 1.000, exact paired reconstruction, and top-direction reduction 16.084 versus random 0.005 at 0.513 GB peak VRAM. Eight focused tests and all 15 solution cells pass. The real-model path is a paired residual/SVD mechanics preflight, not a trained real-model crosscoder replication."
  '7.1':
    status: course_ready
    page: chapter7_activation_to_language/instructions/pages/01_[7.1]_Logit_Lens_Tuned_Lens_and_Patchscopes.md
    notes: "ARENA-style lens and Patchscope lab with thirteen learner-visible exercises, immediate semantic tests, expected/help/solution/interpretation dropdowns, a layer-selection play cell, anomaly hunting, and a three-panel signature result. On 24 disjoint prompts from pinned Pythia-70M, median target rank improves from 18,163 at the embedding to 1 at the final block; block-5 source insertion recovers 87.5% of source targets versus 0% for text-only, cyclic wrong-source, and matched-scale random controls, with mean target log-probability gain 7.73. CUDA 13.2 verification separately loads pinned TransformerLens gelu-1l: a ridge lens improves held-out next-token accuracy from 0.075 to 0.450, Patchscope accuracy is 1.0 versus 0.0 text-only, and random-activation max confidence is 0.0407 at 0.296 GB peak VRAM. Seventeen focused tests and all 18 solution cells pass. The result establishes decodability and activation transfer, not belief or circuit causality."
  '7.2':
    status: prototype
    page: chapter7_activation_to_language/instructions/pages/02_[7.2]_Feature_Verbalizers.md
    notes: "Independent re-review pending. The six-exercise feature-verbalizer lab now uses exact decoder/component-replacement oracles, immediate tokenizer-ID and pair-null tests, expected/help/solution/interpretation dropdowns, a real-hook play cell, anomaly hunting, and a visible six-panel signature. The layer-3 direction reaches 1.0 held-out accuracy, but the exhaustive 4,096-case matched-pair null has p95 1.0 and exact p=0.134 with 548 perfect fits, so decoding is explicitly a negative significance result. The suffix rule scores 1.0/0.5/1.0 by morphology and the narrow final-token-ID lookup scores 0.5 with zero ID overlap. Bidirectional residual replacements change are-minus-is by 8.48/9.62, exceeding stronger 256 paired-swap null p95 values 8.10/9.02 with p=0.0156/0.0078. The separate 64-direction orthogonal null remains visible. Sixteen tests and all 14 learner code cells completed from six dropdowns pass on CUDA 13.2 at 1.017 GB peak VRAM. Claims are causal sensitivity in this prompt family, not uniqueness, completeness, or a full agreement circuit."
  '7.3':
    status: course_ready
    page: chapter7_activation_to_language/instructions/pages/03_[7.3]_Mini_Activation_Oracles.md
    notes: "ARENA-style question-conditioned oracle lab with seven learner exercises, immediate semantic tests, expected/help/solution/interpretation dropdowns, a four-panel signature result, play cell, and anomaly hunt. On exact color/shape/interaction ground truth, the low-rank oracle reaches 1.0 accuracy versus 0.5 text-only and 0.75 activation-only controls, stays at 1.0 on four named OOD splits, abstains on 98.8% of off-manifold activations, and changes exactly the two answers causally downstream of a color-factor patch. Twenty focused tests and all 11 solution cells pass. CUDA 13.2 verification on pinned TransformerLens gelu-1l reaches 1.0 held-out and OOD accuracy, 1.0 random abstention, and the predicted residual-patch answer flip at 0.269 GB peak VRAM. This is exact factor-world evidence plus a real residual-mechanics preflight, not full generative Activation Oracle or AObench parity."
  '7.4':
    status: prototype
    page: chapter7_activation_to_language/instructions/pages/04_[7.4]_Mini_Natural_Language_Autoencoders.md
    notes: "Independent re-review pending after shortcut repair. The nine-exercise mini-NLA lab now predicts complete 24-token explanations for 32 held-out Pythia states, uses the paper's row-normalized FVE, and makes every number/time state within a lexical context share exactly the same token multiset. The contextual Pythia path reaches normalized FVE 0.816 and behavior parity 1.0 versus 0.642 and 0.0 for a matched bag-of-tokens ridge bypass; the bypass's 0.841 within-factor FVE remains visible to show how lexical context can look strong while losing ordered causal factors. Twenty-three focused tests and all 14 learner code cells completed from nine dropdowns pass, including an embedded live signature figure. CUDA 13.2 execution peaks at 1.009 GB and the real one-row text edit changes a candidate logit by 5.61 with exact locality. This remains a supervised templated warm-start, not unsupervised, free-form, or paper-scale NLA training."
  '7.5':
    status: course_ready
    page: chapter7_activation_to_language/instructions/pages/05_[7.5]_Predictive_Concept_Decoders.md
    notes: ARENA-style PCD lesson with eight tested exercises, an exact planted sparse-concept world, explicit concept-question interaction slots, a six-control held-out comparison, causal target-vs-active-control removal, learner-generated heatmap and bar panels, complete inline solution implementations, and a pinned gelu-1l CUDA preflight with 32 direct prediction rows.
  '8.1':
    status: course_ready
    page: chapter8_automated_circuits/instructions/pages/01_[8.1]_Activation_Patching_Refresher.md
    notes: Eight-exercise ARENA lesson on a declared two-hop copy circuit. Students implement the signed metric, normalized recovery, exact patching, denoising and noising sweeps, wrong-position donor controls, and localization metrics; the visible heatmap exactly recovers the three planted route cells with zero off-route response. A separately scoped gelu-1l CUDA preflight verifies real residual-hook mechanics with perfect final-position recovery and zero wrong-position controls.
  '8.2':
    status: course_ready
    page: chapter8_automated_circuits/instructions/pages/02_[8.2]_Attribution_Patching_and_EAP.md
    notes: Seven-exercise ARENA lesson on an exact nonlinear causal graph. Students implement exact node and edge patching, corrupt-point attribution, path integrated gradients, EAP, and EAP-IG; the visible signature exposes a 1.40 gated-route false negative missed by ordinary AP/EAP and recovered by integration, with exact-zero decoys, a linear positive control, and shuffled-delta failure. A separate gelu-1l CUDA mechanics preflight verifies final-position localization for exact, attribution, IG, and EAP paths.
  '8.3':
    status: course_ready
    page: chapter8_automated_circuits/instructions/pages/03_[8.3]_ACDC_and_Circuit_Metrics.md
    notes: "Twenty-one exercise groups implement the full GPT-2 additive graph, hybrid edge interventions, sequential ACDC, EAP, task/KL EAP-IG, circuit metrics and controls. The 94-cell own-answer learner passes all 44 code cells with five owned searches, fourteen measured figures and editable budget, removal and prompt plays. Greater-than circuits frozen on development transfer above both 32-draw null ensembles; ACDC recovery falls to 0.8318, while EAP/task-IG/KL-IG reach 0.8952/0.8586/0.9090. All four IOI candidates fail development and its holdout is unopened; edge-deletion and sampled completeness plots retain the diagnostic limitations. All 56 tests and an independent five-circuit/320-null CUDA check pass with exact behavior agreement. The checkpoint continuation and original interruption are preserved. This is bounded real-model method learning, not complete paper-benchmark replication."
  '8.4':
    status: course_ready
    page: chapter8_automated_circuits/instructions/pages/04_[8.4]_Circuit_Tracing_with_Attribution_Graphs.md
    notes: ARENA-style circuit-tracing lesson with seven tested exercises, an exact planted feature/head/MLP/logit DAG, exact-vs-IG edge heatmaps, top-path extraction, path-only/path-removed faithfulness-completeness-minimality tests, same-size random and reversed-edge controls, editable threshold sweep, inline solution implementations, and an explicitly demoted CUDA residual-position preflight.
  '8.5':
    status: course_ready
    page: chapter8_automated_circuits/instructions/pages/05_[8.5]_Sparse_Feature_Circuits.md
    notes: "ARENA-style sparse-feature-circuit lab with eight visible implementation exercises, exact node/edge ground truth, immediate semantic tests, expected/help/solution/interpretation dropdowns, two signature figures, threshold play, and anomaly hunting. The planted circuit recovers 0.986 of the effect versus 0.014 for a same-size random graph; its faithfulness/completeness are 0.986, and EAP-IG reduces nonlinear attribution error from 7.81e-3 to 8.57e-8. Twenty-three focused tests and all 17 solution cells pass. CUDA 13.2 verification loads the pinned Pythia-70M model and all 19 official SAE dictionaries, validates a 100-example official graph artifact with 59 edges and 37 nodes, obtains 1.0 faithfulness on 40 held-out examples, and recovers 0.583 of a real SAE-mediated effect versus zero for random features at 0.588 GB peak VRAM. SHIFT-style editing raises generated-data OOD accuracy from 0.0 to 1.0 without train loss; the section does not claim broad task or threshold robustness."
  '9.1':
    status: course_ready
    page: chapter9_alignment_interpretability/instructions/pages/01_[9.1]_Refusal_Directions_and_Safe_Steering.md
    notes: "Twelve progressive exercises implement training-only mean directions, AUROC, genuine 32-draw permutation/random nulls, PCA, native Qwen input caching, persistent addition/every-write ablation, greedy EOS generation, marker scoring, paired transitions and development selection. All 26 own-answer code cells pass in 555.72 s with unchanged sources and all 85 final conditions retained. Twenty semantic tests pass. Six inspected figures and three real play cells expose concrete generations, frozen final effects and capability cost. A separate 173.61 s CUDA check regenerates 3640 examples across baseline and all 34 unit-strength conditions, and all 65 target/null score directions, with exact agreement at 1.918 GiB. Layer 16/suffix -1 changes benign marker rate from 1/36 to 27/36 under addition and refusal-category markers from 26/36 to zero under full ablation. Strong addition damages exact benign tasks; near-perfect permutation ranking and visible rubric mistakes remain. This is one small model and an English marker study, not broad safety or a complete paper-suite replication."
  '9.2':
    status: course_ready
    page: chapter9_alignment_interpretability/instructions/pages/02_[9.2]_Chain_of_Thought_Faithfulness.md
    notes: "ARENA-style CoT-faithfulness lab with eight progressive implementation exercises, immediate semantic tests, expected/help/solution/interpretation dropdowns, a 24-example exact toy organism, a visible layer-position probe heatmap, causal residual patching, matched controls, play cells, and anomaly hunting. The exact organism obtains hidden-answer probe accuracy 1.0 versus 0.0 under label shuffling; its targeted causal patch flips 100% of answers and beats the strongest control by a donor-margin gap of 8.0. All 15 solution code cells execute and nine focused CPU tests pass. CUDA 13.2 verification loads pinned EleutherAI/pythia-70m-deduped revision e93a9faa9c77e5d09219f6c868bfc7a1bd65593c and records hidden-answer accuracy 0.775 versus 0.225 under label shuffling at 0.320 GB peak VRAM. That real-model result is deliberately negative: text-only recall is 1.0 and the targeted patch ties the matched random-donor control with a 0.0 gap, so it supports hook execution and falsification rather than a Pythia CoT-faithfulness claim."
  '9.3':
    status: course_ready
    page: chapter9_alignment_interpretability/instructions/pages/03_[9.3]_Emergent_Misalignment_Detection.md
    notes: ARENA-style eight-exercise benign proxy-drift lab with a known causal direction and checkpoint onset, held-out threshold fitting, white-box-vs-delayed-behavior timing, behavior alignment, projection mitigation with capability cost, random-direction and label-shuffle controls, a live three-panel signature, complete inline solutions, and a no-generation pinned Pythia-70M CUDA preflight.
  '9.4':
    status: course_ready
    page: chapter9_alignment_interpretability/instructions/pages/04_[9.4]_White_box_Evals_and_Monitors.md
    notes: "ARENA-style white-box-monitor lab with eight visible exercises, immediate semantic tests, expected/help/solution/interpretation dropdowns, threshold play, and anomaly hunting. On the exact six-feature organism, the white-box monitor gets held-out AUROC/accuracy 1.000/1.000 and catches four surface-identical CoT-unfaithful states that the output-only baseline misses; output-only, shuffled-label, and random-direction AUROCs are 0.800, 0.600, and 0.200. CUDA 13.2 verification loads pinned EleutherAI/pythia-70m-deduped revision e93a9faa9c77e5d09219f6c868bfc7a1bd65593c and obtains monitor AUROC 1.000 and accuracy 1.000 versus black-box proxy accuracy 0.875, with three missed failures, zero monitor false positives, label-shuffle AUROC 0.3875, random-direction AUROC 0.0875, and 0.309 GB peak VRAM. Twelve focused tests and all 21 solution cells pass. The real-model path is a safe hidden-state mechanics preflight without generated completions, not a broad safety-monitor or harmful-content benchmark."
  '10.1':
    status: course_ready
    page: chapter10_capstone_research_sprint/instructions/pages/01_[10.1]_Capstone_Research_Sprint.md
    notes: "ARENA-style exact-model-organism capstone with a preregistered claim, eight learner-implemented and immediately tested subfunctions, expected/help/solution/interpretation dropdowns, 19 of 19 executed solution cells, play and anomaly-hunting cells, and a compact research write-up. The signature result recovers the hidden rotated-XOR direction with cosine 1.000, reaches held-out accuracy 1.000 across eight unseen nuisance templates, transfers donor answers with target accuracy 1.000, and falls to chance after directional ablation. Raw-bit and template-only baselines are 0.500, 128 shuffled-label probes average 0.525, and 256 same-dimensional random patch directions average 0.057; a separate control figure exposes the strongest accidental random alignment instead of hiding it. Eight focused tests pass. CUDA 13.2 verification passes with Torch 2.12.1+cu132 on the RTX 5090 at 0.033 GB peak VRAM. Claims remain limited to exact method validation on this model organism, not a released-model mechanistic discovery."
  '11.1':
    status: course_ready
    page: chapter11_representation_geometry/instructions/pages/01_[11.1]_PCA_SVD_and_Geometry_Controls.md
    notes: >-
      71 cells, 35 executed own-answer code cells, eleven exercise groups,
      sixteen immediate numerical tests, thirteen inspected figures and four
