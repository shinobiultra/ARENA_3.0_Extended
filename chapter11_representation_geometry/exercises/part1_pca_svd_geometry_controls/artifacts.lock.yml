claim_scope: A known cyclic toy task validates train-only PCA, template centering,
  kNN, and ridge coordinate probing before a pinned Pythia-70M-deduped experiment.
  The live real-model path shows raw template-dominated transfer failures and
  template-centered weekday/month identity transfer with learner-generated PCA,
  cross-template cosine retrieval, five-seed by three-setting UMAP sweeps, held-out
  kNN, trustworthiness, neighborhood preservation, permuted labels, white noise,
  and matched random-token controls. It does not claim a literal circular Pythia
  manifold or a causal intervention.
