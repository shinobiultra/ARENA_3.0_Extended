<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Signature result for PCA, SVD, and geometry controls</title>
  <desc id="desc">A table-style visualization showing raw transfer fails, template-centered transfer passes, UMAP kNN and trustworthiness pass, and random controls fail for weekday and month labels.</desc>
  <rect width="920" height="420" fill="#fbfcfe"/>
  <style>
    .title { font: 700 24px sans-serif; fill: #162033; }
    .label { font: 600 15px sans-serif; fill: #223044; }
    .value { font: 700 15px sans-serif; fill: #111827; }
    .small { font: 13px sans-serif; fill: #516174; }
    .grid { stroke: #d6dde8; stroke-width: 1; }
    .good { fill: #dff4e7; }
    .bad { fill: #ffe7dc; }
    .neutral { fill: #e8f1ff; }
  </style>
  <text x="40" y="44" class="title">Pythia calendar geometry: controls before confidence</text>
  <text x="40" y="72" class="small">Pinned Pythia-70M hidden states, template-centered calendar prompts, five UMAP seeds, three reducer settings.</text>
  <rect x="40" y="102" width="840" height="264" rx="8" fill="#ffffff" stroke="#c9d4e2"/>
  <line x1="40" y1="150" x2="880" y2="150" class="grid"/>
  <line x1="40" y1="194" x2="880" y2="194" class="grid"/>
  <line x1="40" y1="238" x2="880" y2="238" class="grid"/>
  <line x1="40" y1="282" x2="880" y2="282" class="grid"/>
  <line x1="40" y1="326" x2="880" y2="326" class="grid"/>
  <line x1="360" y1="102" x2="360" y2="366" class="grid"/>
  <line x1="560" y1="102" x2="560" y2="366" class="grid"/>
  <line x1="720" y1="102" x2="720" y2="366" class="grid"/>
  <text x="62" y="132" class="label">Check</text>
  <text x="426" y="132" text-anchor="middle" class="label">Weekday</text>
  <text x="640" y="132" text-anchor="middle" class="label">Month</text>
  <text x="802" y="132" text-anchor="middle" class="label">Verdict</text>
  <rect x="361" y="151" width="198" height="42" class="bad"/>
  <rect x="561" y="151" width="158" height="42" class="bad"/>
  <text x="62" y="177" class="label">Raw held-out accuracy</text>
  <text x="426" y="177" text-anchor="middle" class="value">0.143</text>
  <text x="640" y="177" text-anchor="middle" class="value">0.500</text>
  <text x="802" y="177" text-anchor="middle" class="small">fails</text>
  <rect x="361" y="195" width="198" height="42" class="good"/>
  <rect x="561" y="195" width="158" height="42" class="good"/>
  <text x="62" y="221" class="label">Template-centered accuracy</text>
  <text x="426" y="221" text-anchor="middle" class="value">1.000</text>
  <text x="640" y="221" text-anchor="middle" class="value">1.000</text>
  <text x="802" y="221" text-anchor="middle" class="small">passes</text>
  <rect x="361" y="239" width="198" height="42" class="good"/>
  <rect x="561" y="239" width="158" height="42" class="good"/>
  <text x="62" y="265" class="label">UMAP held-out kNN floor</text>
  <text x="426" y="265" text-anchor="middle" class="value">0.857</text>
  <text x="640" y="265" text-anchor="middle" class="value">1.000</text>
  <text x="802" y="265" text-anchor="middle" class="small">predictive</text>
  <rect x="361" y="283" width="198" height="42" class="neutral"/>
  <rect x="561" y="283" width="158" height="42" class="neutral"/>
  <text x="62" y="309" class="label">Trustworthiness floor</text>
  <text x="426" y="309" text-anchor="middle" class="value">0.966</text>
  <text x="640" y="309" text-anchor="middle" class="value">0.992</text>
  <text x="802" y="309" text-anchor="middle" class="small">stable</text>
  <rect x="361" y="327" width="198" height="38" class="good"/>
  <rect x="561" y="327" width="158" height="38" class="good"/>
  <text x="62" y="351" class="label">Worst null-control accuracy</text>
  <text x="426" y="351" text-anchor="middle" class="value">0.286</text>
  <text x="640" y="351" text-anchor="middle" class="value">0.306</text>
  <text x="802" y="351" text-anchor="middle" class="small">weak controls</text>
  <text x="40" y="394" class="small">Claim: calendar identity geometry transfers after template-centering. Non-claim: this is not a causal behavior intervention.</text>
</svg>
