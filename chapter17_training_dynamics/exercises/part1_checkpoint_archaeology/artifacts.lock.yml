claim_scope: 'GT-0 developmental-interpretability model organism: a tiny MLP is
  trained on the complete mod-13 addition table, real checkpoint files are saved
  and reloaded, and every metric is recomputed from the reloaded checkpoints. The
  mechanism metric is the fraction of centered logit-table Fourier power in modes
  satisfying k_a = k_b = -k_c mod 13. The notebook validates this metric on exact
  toy ground truth, shows that task accuracy and legal Fourier power rise during
  training, tests early/mid/late legal-mode keep and ablation interventions, and
  rejects random-label plus same-size random-Fourier controls. The finite-domain
  evaluation exhausts all 169 input pairs; no OOD arithmetic generalization or
  large-model developmental mechanism is claimed.'
