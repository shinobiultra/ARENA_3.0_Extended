claim_scope: 'GT-0 developmental-interpretability preflight: deterministic toy AR,
  JEPA, diffusion, Mamba, and random-control trajectories are kept for learner exercises,
  then a tiny modular-addition MLP is trained on CUDA on the complete mod-13 addition
  table. The report saves and reloads real checkpoints, detects stable emergence and
  a phase jump from the reloaded checkpoint accuracies, and rejects a random-label
  checkpoint control evaluated against the true table. This proves the local checkpoint-archaeology
  workflow on a finite model organism. The complete mod-13 input domain is exhausted
  at evaluation time, so the generalization claim is finite-domain coverage rather
  than OOD extrapolation; it is not a claim about large-model developmental mechanisms.'
