claim_scope: >-
  The learner-facing signature result is a GT-0 exact planted sparse-feature
  graph with known SAE nodes, known source-to-receiver edges, exact patching,
  EAP-IG comparison, threshold curves, faithfulness/minimality/completeness,
  and same-size random controls. The serialized CUDA/external-artifact evidence
  is separate GT-2 support: Pythia-70M-deduped residual-feature subject/verb
  preflight, official artifact readiness, one released SAE state-dict check,
  one-layer SAE feature-attribution with random-feature control, a 100-example
  official-code sparse feature graph artifact, and held-out official faithfulness
  on 40 simple_test examples, plus a safe generated-data SHIFT-style editing
  organism that suppresses a spurious feature, preserves target accuracy,
  improves OOD accuracy, and beats a same-size random feature edit.
