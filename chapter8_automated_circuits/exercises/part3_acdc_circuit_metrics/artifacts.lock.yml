controls:
- exact clean and corrupt metric endpoints
- corrupt-matched edge replacement rather than zero ablation
- deliberately failing one-shot insertion baseline
- two matched background-decoy edges
- iterative deletion trace proving metric recomputation
- two-cliff threshold sweep
- faithfulness and edgewise minimality
- pairwise completeness for interacting omitted paths
- exhaustive same-size random-circuit null over all 45 circuits
- three exact held-out toy regimes
- exhaustive real-model same-size random-circuit null over all 56 three-head sets
- three held-out real prompt pairs
- downstream MLP clean-output bottleneck control
- GPT-2 full/empty graph endpoint parity on every evaluated split
- every full additive Q/K/V, MLP-input and final-output edge is eligible
- four fresh IOI searches retain every failed development candidate
- IOI diagnostic is not relabelled as qualified or held-out evidence
- four greater-than masks frozen before changed-wording holdout
- all 32 uniform and 32 receiver-indegree-matched null circuits per inspected circuit
- all retained-edge deletions and 72 full-versus-circuit subset probes
- EAP, task EAP-IG and KL EAP-IG with author-code numerical parity
- all-name versus repeated-subject IOI corruption, fixed clean labels
- fresh learner execution from its own solution dropdowns and separate live CUDA recheck
safety_notes:
- The full learner release records an owned interrupted continuation with exact checkpoint and source provenance.
- The exact toy supplies known mechanisms; GPT-2 behavior is a controlled empirical study.
- IOI development selection fails; its holdout remains unopened.
- Greater-than ACDC recovery drops below the development floor on changed wording; preserve the result.
- Sampled completeness probes are not a global completeness proof.
- Verification reports support generated graphs, curves and prompt experiments.
