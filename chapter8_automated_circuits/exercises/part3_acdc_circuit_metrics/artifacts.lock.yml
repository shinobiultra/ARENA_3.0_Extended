  nonlinear graph with a declared eight-edge ground-truth circuit. Corrupt-matched
  edge intervention, iterative greedy deletion with metric recomputation, a full
  threshold sweep, faithfulness, edgewise minimality, pairwise completeness,
  exhaustive same-size controls, and three held-out toy regimes are all evaluated
