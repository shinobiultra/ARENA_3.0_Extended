evidence_level: exact_nonlinear_warmup_plus_full_gpt2_additive_edge_search_and_author_eap_ig_parity
claim_scope: Students implement the full 32,491-edge GPT-2 additive residual graph, current-hybrid
  corrupt-reference interventions, sequential ACDC, EAP and input-interpolated EAP-IG, metrics, and
  controls. Four independent IOI threshold searches fail the fixed development criteria; their diagnostic
  candidate is evaluated on development only and the IOI holdout stays unopened. Greater-than ACDC,
  EAP, task-loss EAP-IG and KL-loss EAP-IG masks are frozen on development and evaluated on changed
  wording. The bounded studies teach the methods and retain negative results; they do not reproduce
  the papers' complete benchmarks. Original exact and GELU-1L component warm-ups remain.
