claim_scope: 'GT-1 circuit-metric preflight: reusable toy ACDC pruning, faithfulness,
  minimality, completeness, random-baseline, and OOD-template contracts are kept for
  learner exercises, then a pinned TransformerLens gelu-1l checkpoint is loaded on
  CUDA. The report uses exact residual-stream patch scores to prune a position circuit,
  requires the final residual position to be the only kept edge, verifies faithfulness,
  minimality, completeness, and a same-size wrong-position baseline on the primary
  prompt pair, and checks the same final-position localization on held-out safe prompt
  templates. This is a mechanics preflight, not a full ACDC IOI or greater-than circuit
  discovery replication.'
