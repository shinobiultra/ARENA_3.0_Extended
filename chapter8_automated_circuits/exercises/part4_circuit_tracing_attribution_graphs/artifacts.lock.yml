claim_scope: 'GT-1 attribution-graph preflight: reusable toy local-graph, graph-metric,
  path-perturbation, alternative-baseline, and counterfactual-summary contracts are
  kept for learner exercises, then a pinned TransformerLens gelu-1l checkpoint is
  loaded on CUDA. The report builds a top-1 local attribution graph from the real
  EAP position-edge matrix at blocks.0.hook_resid_post, requires the final-position
  self-edge to be the graph edge, and validates target-metric explanation, top-path
  perturbation, same-size alternative baseline failure, and a decrease counterfactual.
  This is a mechanics preflight, not a full sparse-feature or transcoder circuit-tracing
  replication.'
