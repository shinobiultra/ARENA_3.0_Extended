claim_scope: >-
  An exact eight-site nonlinear model organism proves that clean-point first-order
  attribution can miss saturated Q/K sites and an exactly cancelling source. The
  AtP* Q/K softmax correction and GradDrop recover the exact toy ranking. A pinned
  Pythia-70M study over 24 grammar pairs compares exact patching, vanilla AtP, AtP*,
  same-size random circuits, clean-pair shuffling, and label shuffling across 96
  named final-position Q/K sites. The distinct EAP-style baseline is toy-only. This is
  component-level ranking evidence, not a complete circuit interpretation.
