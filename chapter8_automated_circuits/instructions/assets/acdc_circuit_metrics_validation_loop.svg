<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">ACDC and circuit metrics validation loop</title>
  <desc id="desc">Exact patch scores feed an ACDC-style pruning step. The kept circuit is checked by faithfulness, minimality, completeness, random baseline, and held-out template metrics before a scoped report is accepted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="960" height="390" fill="#f8fafc"/>
  <rect x="28" y="28" width="904" height="334" rx="18" fill="#ffffff" stroke="#cbd5e1"/>

  <g filter="url(#shadow)">
    <rect x="58" y="116" width="154" height="96" rx="12" fill="#eef2ff" stroke="#6366f1"/>
    <rect x="252" y="116" width="154" height="96" rx="12" fill="#ecfdf5" stroke="#10b981"/>
    <rect x="446" y="116" width="154" height="96" rx="12" fill="#fff7ed" stroke="#f97316"/>
    <rect x="640" y="70" width="220" height="188" rx="14" fill="#f8fafc" stroke="#64748b"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="135" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">exact patch scores</text>
    <text x="135" y="172" text-anchor="middle" font-size="12" fill="#475569">component recovery</text>
    <text x="135" y="190" text-anchor="middle" font-size="12" fill="#475569">clean vs corrupt</text>

    <text x="329" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">prune candidates</text>
    <text x="329" y="172" text-anchor="middle" font-size="12" fill="#475569">threshold named edges</text>
    <text x="329" y="190" text-anchor="middle" font-size="12" fill="#475569">keep circuit visible</text>

    <text x="523" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">test circuit</text>
    <text x="523" y="172" text-anchor="middle" font-size="12" fill="#475569">patch kept nodes</text>
    <text x="523" y="190" text-anchor="middle" font-size="12" fill="#475569">measure behavior</text>

    <text x="750" y="106" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">metric battery</text>
    <g font-size="13" fill="#334155">
      <text x="676" y="142">faithfulness: preserves behavior</text>
      <text x="676" y="170">minimality: ablation hurts</text>
      <text x="676" y="198">completeness: omitted node adds little</text>
      <text x="676" y="226">random baseline: same-size control fails</text>
      <text x="676" y="246">held-out templates: localizes again</text>
    </g>
  </g>

  <path d="M214 164 H244" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M408 164 H438" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M602 164 H632" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="92" y="285" width="776" height="38" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="480" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">A proposed circuit is not accepted until it survives causal, baseline, and held-out checks.</text>
</svg>
