<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">ACDC and circuit metrics signature result</title>
  <desc id="desc">The accepted 8.3 CUDA preflight shows exact residual-position patch scores pruning to position 5, with faithfulness, minimality, completeness, same-size random baseline, and held-out template checks passing.</desc>
  <rect width="960" height="470" fill="#fbfbfe"/>
  <rect x="30" y="28" width="900" height="414" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="62" y="72" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Signature result: one-position circuit survives the metric battery</text>
  <text x="62" y="100" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Pinned TransformerLens gelu-1l residual-position circuit-metric preflight on CUDA.</text>

  <g font-family="Inter, Arial, sans-serif">
    <text x="76" y="142" font-size="13" font-weight="700" fill="#334155">Exact patch recovery by position</text>
    <line x1="110" y1="326" x2="560" y2="326" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="110" y1="146" x2="110" y2="326" stroke="#cbd5e1" stroke-width="2"/>
    <text x="88" y="151" text-anchor="end" font-size="11" fill="#64748b">1.0</text>
    <text x="88" y="329" text-anchor="end" font-size="11" fill="#64748b">0.0</text>
    <g fill="#cbd5e1">
      <rect x="138" y="326" width="18" height="0"/>
      <rect x="208" y="326" width="18" height="0"/>
      <rect x="278" y="326" width="18" height="0"/>
      <rect x="348" y="326" width="18" height="0"/>
      <rect x="418" y="326" width="18" height="0"/>
    </g>
    <rect x="488" y="146" width="18" height="180" rx="4" fill="#2563eb"/>
    <text x="147" y="348" text-anchor="middle" font-size="12" fill="#334155">0</text>
    <text x="217" y="348" text-anchor="middle" font-size="12" fill="#334155">1</text>
    <text x="287" y="348" text-anchor="middle" font-size="12" fill="#334155">2</text>
    <text x="357" y="348" text-anchor="middle" font-size="12" fill="#334155">3</text>
    <text x="427" y="348" text-anchor="middle" font-size="12" fill="#334155">4</text>
    <text x="497" y="348" text-anchor="middle" font-size="12" fill="#334155">5</text>
    <text x="335" y="378" text-anchor="middle" font-size="12" fill="#64748b">sequence position</text>

    <rect x="122" y="394" width="210" height="34" rx="9" fill="#ecfdf5" stroke="#10b981"/>
    <text x="227" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">kept circuit: position_5</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="640" y="142" font-size="13" font-weight="700" fill="#334155">Accepted circuit checks</text>
    <rect x="628" y="158" width="246" height="220" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <g font-size="14" fill="#0f172a">
      <text x="652" y="194">PASS faithfulness = 1.0</text>
      <text x="652" y="228">PASS minimality damage = 6.2771</text>
      <text x="652" y="262">PASS omitted-node gain = 0.0</text>
      <text x="652" y="296">PASS random margin = 6.2771</text>
      <text x="652" y="330">PASS held-out recoveries = 1.0</text>
    </g>
    <rect x="638" y="394" width="224" height="34" rx="9" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="750" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">3 held-out templates pass</text>
  </g>
</svg>
