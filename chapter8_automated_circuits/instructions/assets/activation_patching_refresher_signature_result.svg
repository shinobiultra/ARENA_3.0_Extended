<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Activation patching signature result</title>
  <desc id="desc">The accepted 8.1 CUDA preflight localizes the final sequence position: final-position patch recovery is 1.0, non-final wrong-position controls are 0.0, and peak VRAM is below 0.3 GB.</desc>
  <rect width="960" height="420" fill="#fbfbfe"/>
  <rect x="32" y="28" width="896" height="364" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="76" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Signature result: only the final-position patch recovers the answer</text>
  <text x="64" y="104" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Pinned TransformerLens gelu-1l residual-stream patching preflight on CUDA.</text>

  <g font-family="Inter, Arial, sans-serif">
    <text x="76" y="151" font-size="13" font-weight="700" fill="#334155">Recovered fraction by sequence position</text>
    <line x1="112" y1="300" x2="812" y2="300" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="112" y1="160" x2="112" y2="300" stroke="#cbd5e1" stroke-width="2"/>
    <text x="90" y="165" text-anchor="end" font-size="11" fill="#64748b">1.0</text>
    <text x="90" y="303" text-anchor="end" font-size="11" fill="#64748b">0.0</text>

    <rect x="142" y="300" width="44" height="0" fill="#94a3b8"/>
    <rect x="252" y="300" width="44" height="0" fill="#94a3b8"/>
    <rect x="362" y="300" width="44" height="0" fill="#94a3b8"/>
    <rect x="472" y="300" width="44" height="0" fill="#94a3b8"/>
    <rect x="582" y="300" width="44" height="0" fill="#94a3b8"/>
    <rect x="692" y="160" width="44" height="140" rx="5" fill="#2563eb"/>

    <text x="164" y="322" text-anchor="middle" font-size="12" fill="#334155">0</text>
    <text x="274" y="322" text-anchor="middle" font-size="12" fill="#334155">1</text>
    <text x="384" y="322" text-anchor="middle" font-size="12" fill="#334155">2</text>
    <text x="494" y="322" text-anchor="middle" font-size="12" fill="#334155">3</text>
    <text x="604" y="322" text-anchor="middle" font-size="12" fill="#334155">4</text>
    <text x="714" y="322" text-anchor="middle" font-size="12" fill="#334155">5</text>
    <text x="462" y="350" text-anchor="middle" font-size="12" fill="#64748b">sequence position</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13">
    <rect x="790" y="142" width="112" height="50" rx="10" fill="#ecfdf5" stroke="#10b981"/>
    <text x="846" y="163" text-anchor="middle" font-weight="800" fill="#064e3b">recovery</text>
    <text x="846" y="181" text-anchor="middle" fill="#065f46">1.00</text>

    <rect x="790" y="206" width="112" height="50" rx="10" fill="#fff7ed" stroke="#f97316"/>
    <text x="846" y="227" text-anchor="middle" font-weight="800" fill="#7c2d12">wrong pos</text>
    <text x="846" y="245" text-anchor="middle" fill="#9a3412">0.00</text>

    <rect x="790" y="270" width="112" height="50" rx="10" fill="#eef2ff" stroke="#6366f1"/>
    <text x="846" y="291" text-anchor="middle" font-weight="800" fill="#312e81">VRAM</text>
    <text x="846" y="309" text-anchor="middle" fill="#4338ca">&lt; 0.3 GB</text>
  </g>
</svg>
