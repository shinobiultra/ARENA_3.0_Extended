<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Attribution patching and EAP signature result</title>
  <desc id="desc">The accepted 8.2 CUDA preflight shows exact patching, attribution patching, and integrated-gradient patching all localize final position 5, and the EAP matrix top edge is position 5 to 5.</desc>
  <rect width="960" height="460" fill="#fbfbfe"/>
  <rect x="30" y="28" width="900" height="404" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="62" y="72" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Signature result: approximations agree with exact final-position patching</text>
  <text x="62" y="100" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Pinned TransformerLens gelu-1l residual-stream attribution-patching preflight on CUDA.</text>

  <g font-family="Inter, Arial, sans-serif">
    <text x="76" y="142" font-size="13" font-weight="700" fill="#334155">Recovered fraction by sequence position</text>
    <line x1="110" y1="326" x2="620" y2="326" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="110" y1="146" x2="110" y2="326" stroke="#cbd5e1" stroke-width="2"/>
    <text x="88" y="151" text-anchor="end" font-size="11" fill="#64748b">1.0</text>
    <text x="88" y="329" text-anchor="end" font-size="11" fill="#64748b">0.0</text>

    <g fill="#94a3b8">
      <rect x="138" y="326" width="8" height="0"/>
      <rect x="218" y="326" width="8" height="0"/>
      <rect x="298" y="326" width="8" height="0"/>
      <rect x="378" y="326" width="8" height="0"/>
      <rect x="458" y="326" width="8" height="0"/>
    </g>
    <rect x="526" y="146" width="10" height="180" rx="3" fill="#2563eb"/>
    <rect x="540" y="153" width="10" height="173" rx="3" fill="#f97316"/>
    <rect x="554" y="151" width="10" height="175" rx="3" fill="#db2777"/>

    <text x="142" y="348" text-anchor="middle" font-size="12" fill="#334155">0</text>
    <text x="222" y="348" text-anchor="middle" font-size="12" fill="#334155">1</text>
    <text x="302" y="348" text-anchor="middle" font-size="12" fill="#334155">2</text>
    <text x="382" y="348" text-anchor="middle" font-size="12" fill="#334155">3</text>
    <text x="462" y="348" text-anchor="middle" font-size="12" fill="#334155">4</text>
    <text x="542" y="348" text-anchor="middle" font-size="12" fill="#334155">5</text>
    <text x="356" y="378" text-anchor="middle" font-size="12" fill="#64748b">sequence position</text>

    <rect x="122" y="394" width="12" height="12" fill="#2563eb"/>
    <text x="142" y="405" font-size="12" fill="#334155">exact 1.00</text>
    <rect x="222" y="394" width="12" height="12" fill="#f97316"/>
    <text x="242" y="405" font-size="12" fill="#334155">attribution 0.9608</text>
    <rect x="378" y="394" width="12" height="12" fill="#db2777"/>
    <text x="398" y="405" font-size="12" fill="#334155">IG 0.9732</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="700" y="142" font-size="13" font-weight="700" fill="#334155">EAP position edge matrix</text>
    <rect x="698" y="158" width="150" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <g fill="#e2e8f0">
      <rect x="710" y="170" width="18" height="18"/>
      <rect x="734" y="194" width="18" height="18"/>
      <rect x="758" y="218" width="18" height="18"/>
      <rect x="782" y="242" width="18" height="18"/>
      <rect x="806" y="266" width="18" height="18"/>
    </g>
    <rect x="830" y="290" width="18" height="18" fill="#2563eb"/>
    <text x="839" y="322" text-anchor="middle" font-size="11" fill="#334155">(5,5)</text>
    <text x="624" y="236" text-anchor="middle" transform="rotate(-90 624 236)" font-size="12" fill="#64748b">upstream</text>
    <text x="773" y="346" text-anchor="middle" font-size="12" fill="#64748b">downstream</text>

    <rect x="666" y="370" width="216" height="38" rx="10" fill="#ecfdf5" stroke="#10b981"/>
    <text x="774" y="393" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">top edge = upstream 5 -> downstream 5</text>
  </g>
</svg>
