<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Attribution patching and EAP validation loop</title>
  <desc id="desc">Exact activation patching is used as the reference. Clean-corrupt activation deltas and corrupt gradients produce attribution, integrated-gradient, and EAP edge scores, which are checked by correlation, top-k overlap, speedup, and false-negative documentation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="960" height="380" fill="#f8fafc"/>
  <rect x="28" y="28" width="904" height="324" rx="18" fill="#ffffff" stroke="#cbd5e1"/>

  <g filter="url(#shadow)">
    <rect x="54" y="80" width="150" height="96" rx="12" fill="#eef2ff" stroke="#6366f1"/>
    <rect x="54" y="206" width="150" height="96" rx="12" fill="#fef2f2" stroke="#ef4444"/>
    <rect x="256" y="142" width="154" height="96" rx="12" fill="#ecfdf5" stroke="#10b981"/>
    <rect x="462" y="80" width="158" height="96" rx="12" fill="#fff7ed" stroke="#f97316"/>
    <rect x="462" y="206" width="158" height="96" rx="12" fill="#fdf2f8" stroke="#db2777"/>
    <rect x="672" y="142" width="176" height="96" rx="12" fill="#f1f5f9" stroke="#64748b"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="129" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">clean cache</text>
    <text x="129" y="136" text-anchor="middle" font-size="12" fill="#475569">reference activations</text>
    <text x="129" y="154" text-anchor="middle" font-size="12" fill="#475569">target behavior</text>

    <text x="129" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">corrupt cache</text>
    <text x="129" y="262" text-anchor="middle" font-size="12" fill="#475569">corrupt activations</text>
    <text x="129" y="280" text-anchor="middle" font-size="12" fill="#475569">corrupt gradients</text>

    <text x="333" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">exact patching</text>
    <text x="333" y="198" text-anchor="middle" font-size="12" fill="#475569">faithful but slow</text>
    <text x="333" y="216" text-anchor="middle" font-size="12" fill="#475569">reference score</text>

    <text x="541" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">attribution / IG</text>
    <text x="541" y="136" text-anchor="middle" font-size="12" fill="#475569">(clean-corrupt)</text>
    <text x="541" y="154" text-anchor="middle" font-size="12" fill="#475569">dot gradient</text>

    <text x="541" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#831843">EAP edges</text>
    <text x="541" y="262" text-anchor="middle" font-size="12" fill="#475569">upstream delta</text>
    <text x="541" y="280" text-anchor="middle" font-size="12" fill="#475569">x downstream grad</text>

    <text x="760" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">accountability</text>
    <text x="760" y="194" text-anchor="middle" font-size="12" fill="#475569">correlation + top-k</text>
    <text x="760" y="212" text-anchor="middle" font-size="12" fill="#475569">runtime + misses</text>
  </g>

  <path d="M206 128 C232 128 230 162 250 176" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M206 254 C232 254 230 216 250 202" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M412 176 C438 164 434 128 454 128" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M412 202 C438 214 434 254 454 254" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M622 128 C650 138 644 166 666 178" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M622 254 C650 244 644 214 666 202" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="96" y="322" width="768" height="34" rx="9" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="480" y="344" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Approximate patching earns trust only by agreeing with exact patching and documenting misses.</text>
</svg>
