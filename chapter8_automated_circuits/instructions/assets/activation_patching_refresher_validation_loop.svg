<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Activation patching validation loop</title>
  <desc id="desc">A clean run and corrupt run feed an activation cache; one clean slice is patched into the corrupt run, the answer logit-diff recovery is scored, then localization and random-position controls are checked.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="960" height="360" fill="#f8fafc"/>
  <rect x="28" y="28" width="904" height="304" rx="18" fill="#ffffff" stroke="#cbd5e1"/>

  <g filter="url(#shadow)">
    <rect x="62" y="76" width="152" height="92" rx="12" fill="#eef2ff" stroke="#6366f1"/>
    <rect x="62" y="194" width="152" height="92" rx="12" fill="#fef2f2" stroke="#ef4444"/>
    <rect x="272" y="135" width="152" height="92" rx="12" fill="#ecfdf5" stroke="#10b981"/>
    <rect x="482" y="135" width="152" height="92" rx="12" fill="#fff7ed" stroke="#f97316"/>
    <rect x="692" y="135" width="168" height="92" rx="12" fill="#fdf2f8" stroke="#db2777"/>
  </g>

  <text x="138" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#312e81">clean run</text>
  <text x="138" y="132" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">correct answer</text>
  <text x="138" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">activation cache</text>

  <text x="138" y="226" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">corrupt run</text>
  <text x="138" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">wrong answer</text>
  <text x="138" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">intervention target</text>

  <text x="348" y="167" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#064e3b">patch slice</text>
  <text x="348" y="191" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">replace one clean</text>
  <text x="348" y="209" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">activation component</text>

  <text x="558" y="167" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#7c2d12">score recovery</text>
  <text x="558" y="191" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">normalize by the</text>
  <text x="558" y="209" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">clean-corrupt gap</text>

  <text x="776" y="166" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#831843">controls</text>
  <text x="776" y="190" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">top component</text>
  <text x="776" y="208" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">beats random/wrong</text>

  <path d="M216 122 C240 122 244 158 266 170" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M216 240 C240 240 244 204 266 192" stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M426 181 H474" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M636 181 H684" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="100" y="304" width="760" height="34" rx="9" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="480" y="326" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">A patching result is evidence only when recovery is normalized and same-hook controls fail.</text>
</svg>
