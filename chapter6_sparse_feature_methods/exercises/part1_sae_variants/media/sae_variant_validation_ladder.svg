<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Evidence ladder for [6.1] SAE Variants</title>
  <desc id="desc">A left-to-right ladder from sparse encoder rules to planted dictionary recovery, held-out validation, real Pythia TopK SAE training, and honest claim boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .box2 { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .box3 { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 8; }
      .box4 { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .title { font: 700 16px sans-serif; fill: #111827; }
      .text { font: 13px sans-serif; fill: #1f2937; }
      .small { font: 12px sans-serif; fill: #475569; }
      .arrow { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .label { font: 700 13px sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect x="20" y="18" width="880" height="264" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="10"/>
  <text x="44" y="50" class="title">[6.1] SAE variants: build the controls before trusting features</text>
  <text x="44" y="74" class="small">Each rung adds one reason a sparse feature claim might be real, and one way it can fail.</text>

  <rect x="44" y="108" width="145" height="96" class="box"/>
  <text x="62" y="136" class="label">Sparse rules</text>
  <text x="62" y="160" class="text">ReLU/L1, TopK,</text>
  <text x="62" y="180" class="text">Gated, JumpReLU</text>

  <path d="M198 156 H246" class="arrow"/>

  <rect x="256" y="108" width="145" height="96" class="box2"/>
  <text x="274" y="136" class="label">Toy truth</text>
  <text x="274" y="160" class="text">Planted dictionary</text>
  <text x="274" y="180" class="text">duplicate detector</text>

  <path d="M410 156 H458" class="arrow"/>

  <rect x="468" y="108" width="145" height="96" class="box2"/>
  <text x="486" y="136" class="label">Validation</text>
  <text x="486" y="160" class="text">Held-out AUC</text>
  <text x="486" y="180" class="text">random controls</text>

  <path d="M622 156 H670" class="arrow"/>

  <rect x="680" y="96" width="178" height="120" class="box3"/>
  <text x="700" y="124" class="label">Pythia SAE preflight</text>
  <text x="700" y="148" class="text">TopK-16, width 256</text>
  <text x="700" y="168" class="text">held-out MSE improves</text>
  <text x="700" y="188" class="text">permuted decoder fails</text>

  <path d="M116 216 C116 252 770 252 770 226" class="arrow"/>
  <text x="364" y="246" class="small">The final claim is deliberately narrow: local SAE mechanics plus a real public LM activation preflight.</text>

  <rect x="604" y="38" width="254" height="44" class="box4"/>
  <text x="622" y="65" class="text">Not a semantic feature benchmark yet</text>
</svg>
