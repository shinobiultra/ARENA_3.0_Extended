evidence_level: toy_sae_contract_plus_pinned_pythia_topk_sae_mechanics_and_semantic_negative_result
claim_scope: 'GT-1 SAE-variant preflight: reusable ReLU/L1, TopK, Gated, JumpReLU,
  planted-dictionary, feature-AUC, and decoder-steering toy contracts are kept for
  learner exercises, then a pinned Pythia-70M-deduped checkpoint is loaded on CUDA.
  The report trains a 256-feature TopK-16 SAE on safe generated final-token hidden
  states, validates held-out normalized reconstruction against a zero baseline, checks
  a permuted-decoder negative control, requires nondegenerate sparse density, records
  held-out feature-label AUC, and tests that adding a learned decoder vector moves the matching
  decoder-projection score more than an orthogonal random direction. No individual
  SAE feature cleanly separates the labels on train or on the topic-disjoint held-out
  set, and this is retained as an explicit
  negative result. This is a local SAE mechanics preflight, not a full GPT-2/Gemma
  SAE benchmark or a semantic feature-interpretation claim.'
