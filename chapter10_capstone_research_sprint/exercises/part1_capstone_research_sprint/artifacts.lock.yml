evidence_level: cuda_trained_activation_oracle_capstone_with_controls
claim_scope: 'GT-4 mini capstone sprint: the section keeps the capstone planning
  scaffold, then runs a real CUDA-trained question-conditioned activation oracle
  on a generated latent-state benchmark. The claim is scoped to this model-organism:
  the oracle beats text-only and linear-probe baselines, solves a nonlinear XOR
  question, generalizes to held-out templates, and passes ablation, counterfactual
  patching, random-patch, random-activation, and label-shuffle controls. It does
  not claim a released-model mechanistic discovery.'
