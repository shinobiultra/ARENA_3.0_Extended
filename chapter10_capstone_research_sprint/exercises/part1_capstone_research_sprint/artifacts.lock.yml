  REQUIRES_GPU: true
gt_tier: GT-4
evidence_level: exact_ground_truth_parity_direction_with_heldout_causal_controls
claim_scope: >-
  A ridge probe fitted to an exact rotated parity model recovers the analytically
  known distributed XOR direction, generalizes to 32 examples from eight held-out
  nuisance templates, and transfers counterfactual donor answers by changing only
  that direction. The claim is limited to method validation on this model organism.
required_gpu_gb: 1
max_allowed_gpu_gb: 24
freshness_inputs:
