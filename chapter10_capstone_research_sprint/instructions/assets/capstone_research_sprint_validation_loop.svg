<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Capstone research sprint validation loop</title>
  <desc id="desc">A loop from claim to baselines, controls, artifacts, and bounded writeup.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3a4a"/>
    </marker>
    <style>
      .bg { fill: #f7f8fb; }
      .box { fill: #ffffff; stroke: #2f3a4a; stroke-width: 2; rx: 8; }
      .accent { fill: #e8f1ff; stroke: #2457a6; }
      .warn { fill: #fff4df; stroke: #a66b14; }
      .text { font: 600 17px sans-serif; fill: #172033; }
      .small { font: 14px sans-serif; fill: #334155; }
      .arrow { stroke: #2f3a4a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="360" rx="12"/>
  <text class="text" x="38" y="42">A capstone result is a loop, not a single score</text>

  <rect class="box accent" x="42" y="82" width="172" height="92" rx="8"/>
  <text class="text" x="66" y="115">Claim</text>
  <text class="small" x="66" y="141">What exact result</text>
  <text class="small" x="66" y="160">would be shown?</text>

  <rect class="box" x="292" y="82" width="172" height="92" rx="8"/>
  <text class="text" x="316" y="115">Baselines</text>
  <text class="small" x="316" y="141">What would make it</text>
  <text class="small" x="316" y="160">uninteresting?</text>

  <rect class="box" x="542" y="82" width="172" height="92" rx="8"/>
  <text class="text" x="566" y="115">Controls</text>
  <text class="small" x="566" y="141">What should fail if</text>
  <text class="small" x="566" y="160">the story is real?</text>

  <rect class="box" x="792" y="82" width="146" height="92" rx="8"/>
  <text class="text" x="816" y="115">Artifacts</text>
  <text class="small" x="816" y="141">Can another</text>
  <text class="small" x="816" y="160">person audit it?</text>

  <rect class="box warn" x="412" y="232" width="196" height="86" rx="8"/>
  <text class="text" x="438" y="264">Bounded writeup</text>
  <text class="small" x="438" y="290">Say what passed and</text>
  <text class="small" x="438" y="309">what was not proven.</text>

  <path class="arrow" d="M214 128 H286"/>
  <path class="arrow" d="M464 128 H536"/>
  <path class="arrow" d="M714 128 H786"/>
  <path class="arrow" d="M864 174 C850 244 728 276 616 276"/>
  <path class="arrow" d="M412 276 C260 276 88 245 88 183"/>
</svg>
