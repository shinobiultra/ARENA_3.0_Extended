<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Capstone signature CUDA result</title>
  <desc id="desc">Bars comparing activation oracle, baselines, OOD accuracy, causal patching, and negative controls.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #2f3a4a; stroke-width: 1.6; rx: 8; }
      .axis { stroke: #94a3b8; stroke-width: 1; }
      .good { fill: #2563eb; }
      .mid { fill: #64748b; }
      .control { fill: #c2410c; }
      .causal { fill: #059669; }
      .text { font: 600 17px sans-serif; fill: #172033; }
      .small { font: 13.5px sans-serif; fill: #334155; }
      .value { font: 600 13px sans-serif; fill: #172033; }
    </style>
  </defs>
  <rect class="bg" width="980" height="420" rx="12"/>
  <text class="text" x="36" y="42">10.1 CUDA mini-capstone: what the report proves</text>
  <rect class="panel" x="34" y="66" width="912" height="314" rx="8"/>

  <line class="axis" x1="260" y1="102" x2="900" y2="102"/>
  <line class="axis" x1="260" y1="164" x2="900" y2="164"/>
  <line class="axis" x1="260" y1="226" x2="900" y2="226"/>
  <line class="axis" x1="260" y1="288" x2="900" y2="288"/>
  <line class="axis" x1="260" y1="350" x2="900" y2="350"/>

  <text class="small" x="64" y="106">Oracle accuracy</text>
  <rect class="good" x="260" y="84" width="600" height="28" rx="4"/>
  <text class="value" x="872" y="104">1.000</text>

  <text class="small" x="64" y="137">Text-only baseline</text>
  <rect class="mid" x="260" y="118" width="300" height="22" rx="4"/>
  <text class="value" x="572" y="135">0.500</text>

  <text class="small" x="64" y="168">Linear probe bank</text>
  <rect class="mid" x="260" y="149" width="527" height="22" rx="4"/>
  <text class="value" x="799" y="166">0.878</text>

  <text class="small" x="64" y="199">Linear probe XOR</text>
  <rect class="mid" x="260" y="180" width="308" height="22" rx="4"/>
  <text class="value" x="580" y="197">0.514</text>

  <text class="small" x="64" y="230">Held-out templates</text>
  <rect class="good" x="260" y="211" width="600" height="22" rx="4"/>
  <text class="value" x="872" y="228">1.000</text>

  <text class="small" x="64" y="261">Ablation drop</text>
  <rect class="causal" x="260" y="242" width="288" height="22" rx="4"/>
  <text class="value" x="560" y="259">0.480</text>

  <text class="small" x="64" y="292">Patch target accuracy</text>
  <rect class="causal" x="260" y="273" width="600" height="22" rx="4"/>
  <text class="value" x="872" y="290">1.000</text>

  <text class="small" x="64" y="323">Random activation</text>
  <rect class="control" x="260" y="304" width="297" height="22" rx="4"/>
  <text class="value" x="569" y="321">0.495</text>

  <text class="small" x="64" y="354">Label shuffle</text>
  <rect class="control" x="260" y="335" width="289" height="22" rx="4"/>
  <text class="value" x="561" y="352">0.481</text>

  <text class="small" x="706" y="394">Peak VRAM: 0.063 GB on RTX 5090 Laptop GPU</text>
</svg>
